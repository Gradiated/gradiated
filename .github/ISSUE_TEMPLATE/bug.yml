name: Bug
description: Report a reproducible product or agent failure.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: impact
    attributes:
      label: User impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, input, environment, and smallest reproducer.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: State the check that should prevent recurrence.
