name: Restore Rust compilation cache
description: Restore trusted main build output without uploading targets from PR checks.
inputs:
  scope:
    required: true
    description: Build/test configuration using the cache.
  mode:
    description: Restore on checks; save only after a successful main-branch check.
    default: restore
runs:
  using: composite
  steps:
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          product/packages/credentials/target
          product/services/gateway/target
          product/services/proxy/target
          product/services/collector/target
        key: ${{ runner.os }}-rust-v2-${{ inputs.scope }}-${{ hashFiles('mise.toml', 'product/**/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-rust-v2-${{ inputs.scope }}-${{ hashFiles('mise.toml', 'product/**/Cargo.lock') }}-
          ${{ runner.os }}-rust-v2-${{ inputs.scope }}-
          ${{ runner.os }}-gateway-contract-
          ${{ runner.os }}-gateway-unit-
    - if: inputs.mode == 'save' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          product/packages/credentials/target
          product/services/gateway/target
          product/services/proxy/target
          product/services/collector/target
        key: ${{ runner.os }}-rust-v2-${{ inputs.scope }}-${{ hashFiles('mise.toml', 'product/**/Cargo.lock') }}-${{ github.sha }}
