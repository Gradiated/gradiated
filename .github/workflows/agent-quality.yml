name: Agent quality

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - ".agents/**"
      - ".github/workflows/agent-quality.yml"
      - "tools/gradctl/**"
      - "tools/ci/**"
      - ".github/workflows/ci-analytics.yml"
      - "AGENTS.md"
      - "mise.toml"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/agent-quality.yml

  devex:
    name: Repo DevEx
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: tools/gradctl/gradctl devex check
      - run: python3 -m unittest discover -s tools/gradctl/tests -v
      - name: Build the single-file gradctl and run it outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python3 "$GITHUB_WORKSPACE/tools/gradctl/build.py" --output "$RUNNER_TEMP/gradctl"
          "$RUNNER_TEMP/gradctl" --json commands > /dev/null
          GRADCTL_REPO="$GITHUB_WORKSPACE" "$RUNNER_TEMP/gradctl" devex skills
      - run: python3 -m unittest discover -s tools/ci -v

  passed:
    name: Agent quality passed
    if: always()
    needs: [changes, devex]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
