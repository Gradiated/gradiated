name: Agent quality

on:
  push:
    branches: [main]
    paths:
      - ".agents/**"
      - ".github/workflows/agent-quality.yml"
      - "tools/devex/**"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
  pull_request:
    paths:
      - ".agents/**"
      - ".github/workflows/agent-quality.yml"
      - "tools/devex/**"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devex:
    name: Repo DevEx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tools/devex/check.py
      - run: python3 -m py_compile tools/devex/*.py
