name: Agent quality

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - ".agents/**"
      - ".github/workflows/agent-quality.yml"
      - "tools/devex/**"
      - "tools/ci/**"
      - ".github/workflows/ci-analytics.yml"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/agent-quality.yml

  devex:
    name: Repo DevEx
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python3 tools/devex/check.py
      - run: python3 -m py_compile tools/devex/*.py
      - run: python3 -m unittest discover -s tools/ci -v

  passed:
    name: Agent quality passed
    if: always()
    needs: [changes, devex]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
