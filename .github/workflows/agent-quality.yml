name: Agent quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devex:
    name: Repo DevEx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tools/devex/check.py
      - run: python3 -m py_compile tools/devex/*.py

  rust:
    name: Rust (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [research/lab]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: ${{ matrix.workspace }}
      - run: cargo test --workspace
        working-directory: ${{ matrix.workspace }}
