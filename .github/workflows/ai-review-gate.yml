# Sets the required "AI review passed" commit status on a pull request's head
# commit. It passes only when both AI reviewers have reviewed that exact commit:
#
# - Codex (chatgpt-codex-connector[bot]): its PR summary comment carries
#   `codex-review-state:v1 {...}`; code_review.commit_sha must equal the head
#   and code_review.status must be "completed". A Codex review whose commit_id
#   is the head also counts.
# - Graphite (graphite-app, app id 158384): the "Graphite / AI Reviews" check
#   run on the head must have completed with conclusion "success". Graphite
#   reports "skipped" when a PR is too large; that does not count.
#
# Findings arrive as review threads from either bot. The main ruleset's
# required_review_thread_resolution rule blocks merge until every thread is
# resolved, so this workflow does not repeat that check.
#
# The result is a commit status rather than this job's own check run, because
# the bots finish after the PR event; their later events (issue_comment,
# check_run) run on main and could not otherwise update a check on the PR head.
# Every trigger runs this file from the default branch. The job reads only the
# GitHub API and never checks out PR code. Codex rewrites its summary comment
# after every review, so issue_comment also covers reviews with findings.
#
# Every run for a PR shares one concurrency key, so a stale "pending" cannot
# overwrite a newer "success". Graphite check_run events without a linked PR
# (fork PRs) are ignored; Codex events and workflow_dispatch still update it.
#
# If a reviewer did not run or failed: comment `@codex review` for Codex, or
# re-run the AI review from the Graphite PR page (the Details link on the
# "Graphite / AI Reviews" check). The status updates when the bot finishes.
# Dependabot PRs follow the same rule. If a reviewer is down and a change
# cannot wait, an organization admin temporarily edits the main ruleset
# (GitHub records this in the ruleset history) and notes it on the PR within
# one business day; see the Change Management Policy.
name: AI review gate

on:
  # pull_request_target runs this file from the default branch, so a PR cannot
  # edit the evaluator to write its own "success". The job never checks out
  # or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  check_run:
    # created/rerequested reset the status to pending while Graphite re-reviews.
    types: [created, rerequested, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

jobs:
  gate:
    name: AI review gate
    # Skip events that cannot change the result. Dependabot-triggered PR runs
    # get a read-only token; the bots' own events on those PRs set the status.
    if: >-
      (github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug == 'graphite-app' &&
        github.event.check_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      checks: read
      statuses: write
    concurrency:
      # One key per PR for every event type, so evaluations run one at a time
      # and a stale "pending" cannot overwrite a newer "success".
      group: ai-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.check_run.pull_requests[0].number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.check_run.pull_requests[0].number }}
      EVENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Evaluate AI reviews
        run: |
          set -euo pipefail
          pr="$PR"
          gh api "repos/$REPO/pulls/$pr" > pr.json
          [ "$(jq -r .state pr.json)" = open ] || exit 0
          head=$(jq -r .head.sha pr.json)

          codex_state=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]") | .body' |
            sed -n 's/.*codex-review-state:v1 \({.*}\) -->.*/\1/p' | tail -n 1)
          codex_status=$(jq -r '.code_review.status // empty' <<< "${codex_state:-null}")
          codex_sha=$(jq -r '.code_review.commit_sha // empty' <<< "${codex_state:-null}")
          [ "$codex_status" = completed ] || codex_sha=""
          codex_review=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews" \
            --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .commit_id == \"$head\") | .id")
          graphite=$(gh api "repos/$REPO/commits/$head/check-runs?app_id=158384&check_name=Graphite%20%2F%20AI%20Reviews" \
            --jq "[.check_runs[] | select(any(.pull_requests[]; .number == $pr))]"' | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
          # A re-request leaves the old run's success in place until Graphite
          # updates it, so treat the review as in progress.
          if [ "$EVENT" = check_run ] && [ "$ACTION" = rerequested ]; then graphite=rerequested; fi

          missing=()
          if [ "$codex_sha" != "$head" ] && [ -z "$codex_review" ]; then
            if [ "$codex_status" = failed ]; then missing+=("Codex failed: comment @codex review"); else missing+=("Codex"); fi
          fi
          if [ "$graphite" != success ]; then missing+=("Graphite ($graphite)"); fi

          if [ ${#missing[@]} -eq 0 ]; then
            state=success; description="Codex and Graphite reviewed ${head:0:7}"
          else
            state=pending; description="Waiting for review of ${head:0:7}: $(IFS=,; echo "${missing[*]}")"
          fi
          echo "PR #$pr $head: $state - $description"
          gh api "repos/$REPO/statuses/$head" -f state="$state" -f context="AI review passed" \
            -f description="${description:0:140}" -f target_url="$RUN_URL" > /dev/null
