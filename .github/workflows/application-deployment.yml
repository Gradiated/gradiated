name: Application deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/application-deployment.yml"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/tests.yml"
      - "product/inference/CMakeLists.txt"
      - "product/inference/desmond/**"
      - "product/inference/engine/**"
      - "product/inference/gpu/**"
      - "product/inference/images/gpu-base/**"
      - "product/inference/host/**"
      - "product/inference/runtimes/kev/**"
      - "product/inference/runtimes/vllm/**"
      - "product/packages/**"
      - ".github/actions/product-changes/**"
      - ".github/actions/relevant/**"
      - ".cargo/config.toml"
      - "product/scripts/**"
      - "product/services/api/**"
      - "product/services/console/**"
      - "product/services/gateway/**"
      - "product/services/proxy/**"
      - "product/services/collector/**"
      - "infra/environments/prod/us-east-1/kubernetes/workloads/**"
      - "infra/environments/prod/us-east-1/kubernetes/gpu-inference/controller.yaml"
      - "infra/environments/prod/us-east-1/kubernetes/gpu-inference/gpu-fleet.yaml"
      - "infra/environments/prod/us-east-1/kubernetes/operations/ops-mcp/**"
      - "product/services/rust-service.Dockerfile"
      - "product/services/worker/**"
      - "product/services/temporal-worker/**"
      - "product/services/ops-mcp/**"
      - "product/services/gpu-fleet/**"
      - "product/.dockerignore"
      - "product/.nvmrc"
      - "product/.prettierignore"
      - "product/Dockerfile"
      - "product/docker-compose.yml"
      - "product/mprocs.yaml"
      - "product/package.json"
      - "product/pnpm-lock.yaml"
      - "product/pnpm-workspace.yaml"
      - "product/prettier.config.mjs"
      - "product/tsconfig.scripts.json"
      - "product/tsconfig.base.json"
      - "product/turbo.json"
      - "mise.toml"
      - "tools/ci/**"
      - ".github/actions/rust-cache/**"
      - "tools/images/**"
      - "tools/virtual-kubelet/**"
      - "tools/deployment/**"
      - "tools/github-apps/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit to deploy. Leave empty to deploy the selected ref.
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
  CONSOLE_BUCKET: gradiated-prod-console-${{ vars.AWS_ACCOUNT_ID }}
  CONSOLE_DOMAIN: console.gradiated.com
  PRODUCT_REPOSITORY: gradiated/prod/product
  GATEWAY_REPOSITORY: gradiated/prod/gateway
  PROXY_REPOSITORY: gradiated/prod/proxy
  COLLECTOR_REPOSITORY: gradiated/prod/collector

jobs:
  resolve:
    name: Resolve source release
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      collector_source_sha: ${{ steps.collector-source.outputs.source_sha }}
      deploy: ${{ steps.order.outputs.deploy == 'true' && (steps.release.outputs.backend == 'true' || steps.release.outputs.console == 'true') }}
      backend: ${{ steps.release.outputs.backend }}
      console: ${{ steps.release.outputs.console }}
      console_sha: ${{ steps.release.outputs.console_sha }}
    steps:
      - id: source
        name: Select source commit
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          SELECTED_REF_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "${DISPATCH_SHA}" ]]; then
            source_sha="${DISPATCH_SHA}"
          else
            source_sha="${SELECTED_REF_SHA}"
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source SHA must contain 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: order
        name: Skip sources older than the recorded release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node tools/deployment/release-order.mjs "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.order.outputs.deploy == 'true'
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
      - id: collector-source
        if: steps.order.outputs.deploy == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if node --input-type=module -e 'import { catalog } from "./tools/images/catalog.mjs"; process.exit(catalog.collector ? 0 : 1)'; then
            echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "source_sha=${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - id: release
        if: steps.order.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node tools/deployment/release-plan.mjs "$SOURCE_SHA"

  build-collector:
    name: Resolve collector image
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ needs.resolve.outputs.collector_source_sha }}
      artifact_prefix: collector
      images: '["collector"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  build-images:
    name: Promote verified application images
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      images: '["product","gateway","proxy","gpu-controller"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  build-console:
    name: Stage verified console
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true' && needs.resolve.outputs.console == 'true'
    runs-on: depot-ubuntu-24.04
    environment: production
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Download the verified production console
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_API_URL: https://api.gradiated.com
          VITE_POSTHOG_KEY: ${{ vars.CONSOLE_POSTHOG_KEY }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: node tools/deployment/console-artifact.mjs fetch "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: deploy-console-stage-${{ github.run_id }}
          retry-max-attempts: 20
          action-timeout-s: 900
      - name: Stage non-entry console files
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          distribution="product/services/console/dist"
          test -f "${distribution}/index.html"
          rm -f "${distribution}/console-proof.json"
          if [[ -d "${distribution}/assets" ]]; then
            aws s3 sync "${distribution}/assets" "s3://${CONSOLE_BUCKET}/assets" \
              --cache-control 'public,max-age=31536000,immutable' \
              --only-show-errors
          fi
          aws s3 sync "${distribution}" "s3://${CONSOLE_BUCKET}" \
            --exclude 'index.html' \
            --exclude 'assets/*' \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --only-show-errors
          aws s3 cp "${distribution}/index.html" \
            "s3://${CONSOLE_BUCKET}/releases/${SOURCE_SHA}/index.html" \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --content-type text/html \
            --only-show-errors
      - name: Store console release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-${{ needs.resolve.outputs.source_sha }}
          path: product/services/console/dist
          if-no-files-found: error
          retention-days: 7

  record-release:
    name: Record immutable release
    permissions:
      contents: read
    needs: [resolve, build-images, build-collector, build-console]
    if: always() && needs.resolve.outputs.deploy == 'true' && needs.build-images.result == 'success' && needs.build-collector.result == 'success' && (needs.build-console.result == 'success' || needs.build-console.result == 'skipped')
    runs-on: ubuntu-latest
    # The release app key is a production environment secret: only main can use it.
    environment: production
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    outputs:
      release_commit: ${{ steps.commit.outputs.release_commit }}
    steps:
      - name: Create release push token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - name: Update release state
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CONSOLE_SHA: ${{ needs.resolve.outputs.console_sha }}
          GPU_CONTROLLER_DIGEST: ${{ fromJSON(needs.build-images.outputs.images)['gpu-controller'].digest }}
          PRODUCT_DIGEST: ${{ needs.build-images.outputs.product_digest }}
          GATEWAY_DIGEST: ${{ needs.build-images.outputs.gateway_digest }}
          PROXY_DIGEST: ${{ needs.build-images.outputs.proxy_digest }}
          COLLECTOR_DIGEST: ${{ needs.build-collector.outputs.collector_digest }}
        run: |
          git pull --ff-only origin main
          node tools/deployment/release-order.mjs "$SOURCE_SHA" --reject-stale
          node tools/deployment/update-release.mjs \
            --source-sha "${SOURCE_SHA}" \
            --console-sha "${CONSOLE_SHA}" \
            --deployment-run-id "${GITHUB_RUN_ID}" \
            --product-digest "${PRODUCT_DIGEST}" \
            --gateway-digest "${GATEWAY_DIGEST}" \
            --proxy-digest "${PROXY_DIGEST}" \
            --collector-digest "${COLLECTOR_DIGEST}" \
            --gpu-controller-digest "${GPU_CONTROLLER_DIGEST}"
          kubectl kustomize infra/environments/prod/us-east-1/kubernetes/workloads >/dev/null
      - id: commit
        name: Commit production release to main
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: bash tools/deployment/commit-release.sh

  wait-for-argo:
    name: Wait for Argo rollout
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: [resolve, build-images, build-collector, record-release]
    if: needs.resolve.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: aws kubectl node
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: deploy-wait-${{ github.run_id }}
      - name: Join the tailnet for the Kubernetes API
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci
      - name: Enable private AWS subnet routes
        run: sudo "$(command -v tailscale)" set --accept-routes=true
      - name: Connect to production cluster
        run: aws eks update-kubeconfig --name gradiated-prod --region "${AWS_REGION}"
      - name: Wait for the recorded release
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PRODUCT_DIGEST: ${{ needs.build-images.outputs.product_digest }}
          GATEWAY_DIGEST: ${{ needs.build-images.outputs.gateway_digest }}
          PROXY_DIGEST: ${{ needs.build-images.outputs.proxy_digest }}
          COLLECTOR_DIGEST: ${{ needs.build-collector.outputs.collector_digest }}
        shell: bash
        run: |
          product_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PRODUCT_REPOSITORY}@${PRODUCT_DIGEST}"
          gateway_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${GATEWAY_REPOSITORY}@${GATEWAY_DIGEST}"
          proxy_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROXY_REPOSITORY}@${PROXY_DIGEST}"
          collector_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${COLLECTOR_REPOSITORY}@${COLLECTOR_DIGEST}"
          # Research may explicitly pin the gateway image through Argo's ignore policy.
          if kubectl --request-timeout=20s -n argocd get application gateway -o json | jq -e '
            any(.spec.ignoreDifferences[]?;
              .group == "apps" and .kind == "Deployment" and
              .name == "gateway" and .namespace == "gradiated" and
              any(.jsonPointers[]?; . == "/spec/template/spec/containers/0/image"))
          ' >/dev/null; then
            gateway_image=$(kubectl --request-timeout=20s -n gradiated get deployment gateway -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "Verifying the gateway's explicitly pinned image: ${gateway_image}"
          fi
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            api_image="$(kubectl --request-timeout=20s -n gradiated get deployment api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}' 2>/dev/null || true)"
            worker_image="$(kubectl --request-timeout=20s -n gradiated get deployment worker -o jsonpath='{.spec.template.spec.containers[?(@.name=="worker")].image}' 2>/dev/null || true)"
            temporal_worker_image="$(kubectl --request-timeout=20s -n gradiated get deployment temporal-worker -o jsonpath='{.spec.template.spec.containers[?(@.name=="temporal-worker")].image}' 2>/dev/null || true)"
            gateway_image_actual="$(kubectl --request-timeout=20s -n gradiated get deployment gateway -o jsonpath='{.spec.template.spec.containers[?(@.name=="gateway")].image}' 2>/dev/null || true)"
            proxy_image_actual="$(kubectl --request-timeout=20s -n gradiated get deployment proxy -o jsonpath='{.spec.template.spec.containers[?(@.name=="proxy")].image}' 2>/dev/null || true)"
            collector_image_actual="$(kubectl --request-timeout=20s -n gradiated get deployment collector -o jsonpath='{.spec.template.spec.containers[?(@.name=="collector")].image}' 2>/dev/null || true)"
            source_revision="$(kubectl --request-timeout=20s -n gradiated get configmap gradiated-release -o jsonpath='{.data.sourceRevision}' 2>/dev/null || true)"
            if [[ "${api_image}" == "${product_image}" && "${worker_image}" == "${product_image}" && "${temporal_worker_image}" == "${product_image}" && "${gateway_image_actual}" == "${gateway_image}" && "${proxy_image_actual}" == "${proxy_image}" && "${collector_image_actual}" == "${collector_image}" && "${source_revision}" == "${SOURCE_SHA}" ]]; then
              break
            fi
            sleep 10
          done
          if (( SECONDS >= deadline )); then
            echo "Argo did not apply the expected release within 20 minutes." >&2
            exit 1
          fi
          kubectl --request-timeout=20s -n gradiated rollout status deployment/worker --timeout=10m
          kubectl --request-timeout=20s -n gradiated rollout status deployment/temporal-worker --timeout=10m
          kubectl --request-timeout=20s -n gradiated rollout status deployment/collector --timeout=10m
          node tools/deployment/wait-rollouts.mjs
          PRODUCT_IMAGE="${product_image}" node tools/deployment/training-readiness.mjs
          node tools/deployment/inference-probe-readiness.mjs

  publish-console:
    name: Publish console and verify production
    needs: [resolve, record-release, wait-for-argo]
    if: always() && needs.resolve.outputs.console == 'true' && needs.record-release.result == 'success' && (needs.wait-for-argo.result == 'success' || (needs.resolve.outputs.backend != 'true' && needs.wait-for-argo.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download console release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: console-${{ needs.resolve.outputs.source_sha }}
          path: console-dist
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: deploy-console-publish-${{ github.run_id }}
      - name: Publish console entry point
        id: publish
        shell: bash
        run: |
          distribution_id="$(aws cloudfront list-distributions --output json | jq -r \
            '.DistributionList.Items[] | select(.Aliases.Items[]? == "console.gradiated.com") | .Id' | head -n 1)"
          if [[ -z "${distribution_id}" || "${distribution_id}" == "null" ]]; then
            echo "Could not find the console CloudFront distribution." >&2
            exit 1
          fi
          aws s3 cp console-dist/index.html "s3://${CONSOLE_BUCKET}/index.html" \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --content-type text/html \
            --only-show-errors
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${distribution_id}" \
            --id "${invalidation_id}"
      - name: Smoke test production release
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${CONSOLE_DOMAIN}/" --output /tmp/console-index.html
          cmp console-dist/index.html /tmp/console-index.html
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${CONSOLE_DOMAIN}/login" --output /tmp/console-login.html
          cmp console-dist/index.html /tmp/console-login.html
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${CONSOLE_DOMAIN}/brand/gradiated-icon.svg" \
            --output /tmp/console-logo.svg
          cmp console-dist/brand/gradiated-icon.svg /tmp/console-logo.svg
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            https://api.gradiated.com/health/ready
