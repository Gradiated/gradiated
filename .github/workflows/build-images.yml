name: Build images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Source commit whose image inputs are resolved.
        required: true
        type: string
      artifact_prefix:
        description: Unique result group within the caller workflow.
        type: string
        default: application
      images:
        description: JSON array of catalog image names required by this caller.
        type: string
        default: '["product","gateway","proxy"]'
      vulnerability_scan:
        description: "Trivy scan of each published image: enforce (fail on CRITICAL with a fix), report, or skip."
        type: string
        default: enforce
    outputs:
      product_digest:
        value: ${{ jobs.resolve.outputs.product_digest }}
      gateway_digest:
        value: ${{ jobs.resolve.outputs.gateway_digest }}
      proxy_digest:
        value: ${{ jobs.resolve.outputs.proxy_digest }}
      collector_digest:
        value: ${{ jobs.resolve.outputs.collector_digest }}
      images:
        description: JSON map of exact image digests and source revisions.
        value: ${{ jobs.resolve.outputs.images }}

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs plan "$IMAGES" "$SOURCE_SHA"

  build:
    needs: plan
    runs-on: depot-ubuntu-24.04
    environment: production
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: image-${{ matrix.name }}-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - id: existing
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: node tools/images/images.mjs lookup "$REPOSITORY" "$IMAGE_TAG"
      - if: steps.existing.outputs.exists != 'true'
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - if: steps.existing.outputs.exists != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: steps.existing.outputs.exists != 'true'
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ matrix.tag }}
      - name: Record resolved digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ matrix.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs record "$IMAGE_NAME" "$REPOSITORY" "$IMAGE_TAG" "$SOURCE_SHA"
      # Scan the exact published digest; nothing is rebuilt. The scanner, its version and
      # the accepted risks in .trivyignore come from the workflow revision, so deploying
      # an older source commit still uses the current policy.
      - name: Check out the vulnerability scan policy
        if: inputs.vulnerability_scan != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .agents/runtime/security-policy
          sparse-checkout: |
            .trivyignore
            mise.toml
            tools/security/scan_report.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - if: inputs.vulnerability_scan != 'skip'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          working_directory: .agents/runtime/security-policy
          install_args: trivy
      - name: Scan the published image with Trivy
        if: inputs.vulnerability_scan != 'skip'
        working-directory: .agents/runtime/security-policy
        env:
          IMAGE_NAME: ${{ matrix.name }}
          SCAN_MODE: ${{ inputs.vulnerability_scan }}
        shell: bash
        run: |
          result="${GITHUB_WORKSPACE}/image-results/${IMAGE_NAME}.json"
          image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/$(jq -er .repository "${result}")@$(jq -er .digest "${result}")"
          mkdir -p reports
          # Trivy reads ECR credentials from the AWS session configured above.
          trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --platform linux/amd64 \
            --ignorefile .trivyignore --format json --output "reports/${IMAGE_NAME}.json" "${image}"
          gate=()
          if [[ "${SCAN_MODE}" == "enforce" ]]; then
            gate=(--enforce)
          fi
          python3 tools/security/scan_report.py trivy "reports/${IMAGE_NAME}.json" \
            --name "${IMAGE_NAME}" "${gate[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Store vulnerability report
        if: always() && inputs.vulnerability_scan != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-trivy-${{ matrix.name }}
          path: .agents/runtime/security-policy/reports/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-image-${{ matrix.name }}
          path: image-results/*.json
          retention-days: 7

  resolve:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
      product_digest: ${{ steps.collect.outputs.product_digest }}
      gateway_digest: ${{ steps.collect.outputs.gateway_digest }}
      proxy_digest: ${{ steps.collect.outputs.proxy_digest }}
      collector_digest: ${{ steps.collect.outputs.collector_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ inputs.artifact_prefix }}-image-*
          path: image-results
          merge-multiple: true
      - id: collect
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs collect "$IMAGES" "$SOURCE_SHA"
