name: Build images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Source commit whose image inputs are resolved.
        required: true
        type: string
      artifact_prefix:
        description: Unique result group within the caller workflow.
        type: string
        default: application
      images:
        description: JSON array of catalog image names required by this caller.
        type: string
        default: '["product","gateway"]'
    outputs:
      product_digest:
        value: ${{ jobs.resolve.outputs.product_digest }}
      gateway_digest:
        value: ${{ jobs.resolve.outputs.gateway_digest }}
      images:
        description: JSON map of exact image digests and source revisions.
        value: ${{ jobs.resolve.outputs.images }}

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs plan "$IMAGES" "$SOURCE_SHA"

  build:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: image-${{ matrix.name }}-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - id: existing
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: node tools/images/images.mjs lookup "$REPOSITORY" "$IMAGE_TAG"
      - name: Free disk for model image publication
        if: steps.existing.outputs.exists != 'true' && startsWith(matrix.context, 'product/inference')
        shell: bash
        run: |
          # Hosted-runner SDKs are not used by these Docker-only model builds.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( available_kib < 25 * 1024 * 1024 )); then
            echo 'Model image publication requires at least 25 GiB of free disk.' >&2
            exit 1
          fi
      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.exists != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ matrix.tag }}
          cache-from: ${{ !startsWith(matrix.context, 'product/inference') && format('type=gha,scope=image-{0}', matrix.name) || '' }}
          cache-to: ${{ !startsWith(matrix.context, 'product/inference') && format('type=gha,mode=max,scope=image-{0}', matrix.name) || '' }}
      - name: Record resolved digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ matrix.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs record "$IMAGE_NAME" "$REPOSITORY" "$IMAGE_TAG" "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-image-${{ matrix.name }}
          path: image-results/*.json
          retention-days: 7

  resolve:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
      product_digest: ${{ steps.collect.outputs.product_digest }}
      gateway_digest: ${{ steps.collect.outputs.gateway_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}-image-*
          path: image-results
          merge-multiple: true
      - id: collect
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs collect "$IMAGES" "$SOURCE_SHA"
