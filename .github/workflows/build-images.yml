name: Build images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Source commit whose image inputs are resolved.
        required: true
        type: string
      artifact_prefix:
        description: Unique result group within the caller workflow.
        type: string
        default: application
      images:
        description: JSON array of catalog image names required by this caller.
        type: string
        default: '["product","gateway","proxy"]'
    outputs:
      product_digest:
        value: ${{ jobs.resolve.outputs.product_digest }}
      gateway_digest:
        value: ${{ jobs.resolve.outputs.gateway_digest }}
      proxy_digest:
        value: ${{ jobs.resolve.outputs.proxy_digest }}
      collector_digest:
        value: ${{ jobs.resolve.outputs.collector_digest }}
      images:
        description: JSON map of exact image digests and source revisions.
        value: ${{ jobs.resolve.outputs.images }}

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs plan "$IMAGES" "$SOURCE_SHA"

  build:
    name: Promote CI image (${{ matrix.name }})
    needs: plan
    runs-on: depot-ubuntu-24.04
    environment: production
    env:
      RELEASE_STATE_ROOT: ${{ vars.RELEASE_STATE_REPO == 'infrastructure' && format('{0}/infra-release-state', github.workspace) || '' }}
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: image-${{ matrix.name }}-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Create read-only release state token
        if: env.RELEASE_STATE_ROOT != ''
        id: read-release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infrastructure
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEASE_STATE_ROOT != ''
        with:
          repository: ${{ github.repository_owner }}/infrastructure
          ref: main
          fetch-depth: 0
          path: infra-release-state
          token: ${{ steps.read-release-token.outputs.token }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Resolve the passing CI artifact for these exact inputs
        id: verified
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/verified.mjs fetch "$IMAGE_NAME" "$SOURCE_SHA"
      - name: Install the image transfer tool
        if: steps.verified.outputs.publish == 'true'
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - if: steps.verified.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Publish the verified image without rebuilding
        if: steps.verified.outputs.publish == 'true'
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ steps.verified.outputs.tag }}
        run: skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" oci-archive:ci-image/image.tar "docker://${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY}:${IMAGE_TAG}"
      - name: Record promoted digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ steps.verified.outputs.tag }}
          EXISTING_DIGEST: ${{ steps.verified.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$EXISTING_DIGEST" ]]; then
            node tools/images/images.mjs record-digest "$IMAGE_NAME" "$REPOSITORY" "$EXISTING_DIGEST" "$SOURCE_SHA"
          else
            node tools/images/images.mjs record "$IMAGE_NAME" "$REPOSITORY" "$IMAGE_TAG" "$SOURCE_SHA"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-image-${{ matrix.name }}
          path: image-results/*.json
          retention-days: 7

  resolve:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
      product_digest: ${{ steps.collect.outputs.product_digest }}
      gateway_digest: ${{ steps.collect.outputs.gateway_digest }}
      proxy_digest: ${{ steps.collect.outputs.proxy_digest }}
      collector_digest: ${{ steps.collect.outputs.collector_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_prefix }}-image-*
          path: image-results
          merge-multiple: true
      - id: collect
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/images/images.mjs collect "$IMAGES" "$SOURCE_SHA"
