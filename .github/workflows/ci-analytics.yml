name: CI analytics

on:
  workflow_run:
    workflows: [Product tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: PR head SHA to collect, including isolated workflow reruns.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-analytics-${{ github.event.workflow_run.head_sha || inputs.head_sha }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      # workflow_run uses the trusted default-branch revision, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Wait for the CI round and send workflow/step events
        env:
          GH_TOKEN: ${{ github.token }}
          POSTHOG_KEY: ${{ vars.CONSOLE_POSTHOG_KEY }}
        run: python3 tools/ci/posthog.py
