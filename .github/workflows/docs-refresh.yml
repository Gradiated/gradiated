name: Docs refresh

# Once a day, a Claude Agent SDK agent checks the developer docs against the code and recent
# commits, then opens or updates one pull request on automation/docs-refresh.
# See tools/docs-refresh/README.md.
on:
  schedule:
    - cron: "23 6 * * *"
  # A pull request that changes the tool gets a dry run, so prompt changes are tried before they merge.
  pull_request:
    paths:
      - ".github/workflows/docs-refresh.yml"
      - "tools/docs-refresh/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the proposed diff without pushing or touching pull requests
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-refresh-{0}', github.ref) || 'docs-refresh' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}

jobs:
  refresh:
    name: Refresh developer docs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DOCS_REFRESH_ANTHROPIC_API_KEY }}
          DOCS_APP_CLIENT_ID: ${{ vars.DOCS_APP_CLIENT_ID }}
          GRADIATED_API_KEY: ${{ secrets.DOCS_REFRESH_GRADIATED_API_KEY }}
        run: |
          missing=0
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Set the DOCS_REFRESH_ANTHROPIC_API_KEY repository secret."; missing=1; }
          [ "$DRY_RUN" = true ] || [ -n "$DOCS_APP_CLIENT_ID" ] || { echo "::error::Create the Gradiated Docs app with 'mise run github-apps:create -- docs'."; missing=1; }
          [ -n "$GRADIATED_API_KEY" ] || echo "::warning::DOCS_REFRESH_GRADIATED_API_KEY is not set, so the audits run on Claude Sonnet 5.5."
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The agent runs in this checkout; keep the job token out of .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: pnpm install --frozen-lockfile
        working-directory: product
      # prepare switches the checkout to the docs branch, so run this run's copy of the tool.
      - run: |
          cp -R tools/docs-refresh "$RUNNER_TEMP/docs-refresh"
          npm ci --prefix "$RUNNER_TEMP/docs-refresh" --no-audit --no-fund
      - name: Prepare the docs branch and context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/docs-refresh/refresh.mjs" prepare
      - name: Run the docs agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DOCS_REFRESH_ANTHROPIC_API_KEY }}
          DOCS_REFRESH_GRADIATED_API_KEY: ${{ secrets.DOCS_REFRESH_GRADIATED_API_KEY }}
          DOCS_REFRESH_AUDIT_MODEL: ${{ vars.DOCS_REFRESH_AUDIT_MODEL || 'moonshotai/kimi-k3.1-pro' }}
          DOCS_REFRESH_AUDIT_CONCURRENCY: ${{ vars.DOCS_REFRESH_AUDIT_CONCURRENCY || '2' }}
          DOCS_REFRESH_MODEL: ${{ vars.DOCS_REFRESH_MODEL || 'claude-opus-5-5' }}
          DOCS_REFRESH_EFFORT: ${{ vars.DOCS_REFRESH_EFFORT || 'high' }}
          DOCS_REFRESH_MAX_BUDGET_USD: ${{ vars.DOCS_REFRESH_MAX_BUDGET_USD || '20' }}
        run: node "$RUNNER_TEMP/docs-refresh/refresh.mjs" agent
      # Created after the agent so the agent never sees a write token.
      - name: Create docs app token
        id: app-token
        if: env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Build, commit, and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DOCS_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_REFRESH_DRY_RUN: ${{ env.DRY_RUN }}
        run: node "$RUNNER_TEMP/docs-refresh/refresh.mjs" publish
      - name: Keep the agent output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-refresh
          path: .agents/runtime/docs-refresh/
          include-hidden-files: true
          retention-days: 14
