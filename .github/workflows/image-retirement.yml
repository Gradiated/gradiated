name: Retire unused container images

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible images (otherwise preview only).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image-retirement-run.yml
    with:
      apply: ${{ github.event_name == 'schedule' || inputs.apply || false }}
