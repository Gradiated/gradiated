name: Model deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - product/inference/gpu/**
      - product/inference/host/**
      - product/inference/images/**
      - product/inference/CMakeLists.txt
      - product/inference/desmond/**
      - product/inference/engine/**
      - product/inference/.dockerignore
      - product/inference/bundles/**
      - product/inference/training/**
      - product/packages/autotrain
      - product/packages/autotrain/**
      - product/packages/contracts/src/training-recipe.json
      - product/inference/runtimes/decider/**
      - product/inference/runtimes/linden/**
      - product/inference/runtimes/jevk5/**
      - product/inference/runtimes/jeeves/**
      - product/inference/runtimes/posthog/posthog_common.py
      - product/inference/runtimes/kev/adapter.py
      - product/inference/runtimes/glm/**
      - product/inference/runtimes/glm-sglang/**
      - product/inference/runtimes/deepseek-sglang/**
      - product/inference/runtimes/kimi-k31/**
      - product/inference/runtimes/energy/**
      - product/inference/lora/**
      - product/inference/runtime-launcher/**
      - tools/images/**
      - tools/models/**
      - tools/virtual-kubelet/host_agent_test.py
      - tools/virtual-kubelet/host_state_test.py
      - infra/environments/prod/us-east-1/kubernetes/workloads/gateway.yaml
      - mise.toml
      - .github/workflows/model-deployment.yml
      - .github/workflows/build-images.yml
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: model-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/model-deployment.yml

  checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 90
    outputs:
      bundles: ${{ steps.bundles.outputs.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -m pip install PyYAML==6.0.2
      - id: verification
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/models/verify-inputs.mjs "$BASE_SHA"
      # Only the training bundle builds from the private autotrain library, so
      # other pull requests, including Dependabot's, need no app key.
      - name: Read pinned autotrain revision
        id: autotrain
        if: contains(steps.verification.outputs.targets, 'verify-training')
        run: echo "revision=$(git rev-parse HEAD:product/packages/autotrain)" >> "$GITHUB_OUTPUT"
      - name: Create autotrain read token
        id: autotrain-token
        if: contains(steps.verification.outputs.targets, 'verify-training')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOTRAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOTRAIN_APP_PRIVATE_KEY }}
          owner: Gradiated
          repositories: autotrain
          permission-contents: read
      - name: Check out private training library
        if: contains(steps.verification.outputs.targets, 'verify-training')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gradiated/autotrain
          ref: ${{ steps.autotrain.outputs.revision }}
          path: product/packages/autotrain
          token: ${{ steps.autotrain-token.outputs.token }}
          persist-credentials: false
      - run: |
          node --test tools/images/*.test.mjs tools/models/*.test.mjs
      - name: Check runtime configuration before native builds
        if: steps.verification.outputs.required == 'true'
        run: |
          python3 -m unittest discover -s product/inference/runtimes/glm-sglang -p test_config.py
          python3 -m unittest discover -s product/inference/runtimes/deepseek-sglang -p test_config.py
          python3 -m unittest discover -s product/inference/runtimes/kimi-k31 -p test_config.py
          python3 -m unittest discover -s product/inference/bundles/kimi-k31-pro/tests -p test_verify_environment.py
          python3 -m unittest discover -s product/inference/runtimes/energy -p 'test_*.py'
      - id: bundles
        run: echo "bundles=$(node tools/models/release.mjs list)" >> "$GITHUB_OUTPUT"
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        if: steps.verification.outputs.required == 'true'
      - name: Verify the complete runtime on pull requests
        if: steps.verification.outputs.required == 'true'
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          files: product/inference/bundles/build.hcl
          targets: ${{ steps.verification.outputs.targets }}

  images:
    needs: checks
    # A manual run on main republishes after a failed push run, for example
    # when the Terraform prerequisite failed and was fixed by a later commit.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ github.sha }}
      images: '["gpu-base"]'
      artifact_prefix: models

  runtime:
    needs: [checks, images]
    runs-on: depot-ubuntu-24.04
    environment: production
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.checks.outputs.bundles) }}
    env:
      BUNDLE: ${{ matrix.bundle }}
      SOURCE_SHA: ${{ github.sha }}
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: gradiated-prod-model-artifacts-${{ vars.AWS_ACCOUNT_ID }}
      BASE_IMAGE: ${{ format('{0}.dkr.ecr.us-east-1.amazonaws.com/gradiated/prod/inference@{1}', vars.AWS_ACCOUNT_ID, fromJSON(needs.images.outputs.images)['gpu-base'].digest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read pinned autotrain revision
        id: autotrain
        run: echo "revision=$(git rev-parse HEAD:product/packages/autotrain)" >> "$GITHUB_OUTPUT"
      - name: Create autotrain read token
        id: autotrain-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOTRAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOTRAIN_APP_PRIVATE_KEY }}
          owner: Gradiated
          repositories: autotrain
          permission-contents: read
      - name: Check out private training library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gradiated/autotrain
          ref: ${{ steps.autotrain.outputs.revision }}
          path: product/packages/autotrain
          token: ${{ steps.autotrain-token.outputs.token }}
          persist-credentials: false
      - name: Wait for the source infrastructure prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/models/wait-infrastructure.mjs
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - id: existing
        run: node tools/models/release.mjs lookup "$BUNDLE" "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: steps.existing.outputs.exists != 'true'
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Package and verify the runtime
        if: steps.existing.outputs.exists != 'true'
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: ${{ matrix.bundle == 'host' && '.' || (matrix.bundle == 'training' && 'product' || 'product/inference') }}
          file: ${{ matrix.bundle == 'training' && 'product/inference/training/Dockerfile' || format('product/inference/bundles/{0}/Dockerfile', matrix.bundle) }}
          platforms: linux/amd64
          build-contexts: runtime-base=docker-image://${{ env.BASE_IMAGE }}
          target: artifact
          outputs: type=local,dest=model-release
      - if: steps.existing.outputs.exists != 'true'
        run: node tools/models/release.mjs publish "$BUNDLE" "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.bundle }}-runtime-release
          path: model-release/release.json
          retention-days: 30

  promote-host:
    name: Record host bundle release
    needs: runtime
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency:
      group: host-bundle-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Create release push token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: host-runtime-release
          path: ${{ runner.temp }}/host-runtime-release
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Commit the compatible host bundle pin
        env:
          SOURCE_SHA: ${{ github.sha }}
          HOST_RELEASE: ${{ runner.temp }}/host-runtime-release/release.json
        run: node tools/models/promote-host.mjs "$HOST_RELEASE"

  passed:
    name: Model deployment passed
    if: always()
    needs: [changes, checks, images, runtime, promote-host]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
