name: Model deployment

on:
  push:
    branches: [main]
    paths:
      - product/inference/images/**
      - product/inference/bundles/**
      - product/inference/runtime-launcher/**
      - tools/images/**
      - tools/models/**
      - .github/workflows/model-deployment.yml
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - product/inference/images/**
      - product/inference/bundles/**
      - product/inference/runtime-launcher/**
      - tools/images/**
      - tools/models/**
      - .github/workflows/model-deployment.yml
      - .github/workflows/build-images.yml

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: model-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: verification
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/models/verify-inputs.mjs "$BASE_SHA"
      - run: |
          node --test tools/images/*.test.mjs tools/models/*.test.mjs
          bash product/inference/images/tests/test_launch.sh
      - uses: depot/setup-action@v1
        if: steps.verification.outputs.required == 'true'
      - name: Verify the complete runtime on pull requests
        if: steps.verification.outputs.required == 'true'
        uses: depot/bake-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          files: product/inference/bundles/build.hcl
          targets: verify

  images:
    needs: checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ github.sha }}
      images: '["nomad-base"]'
      artifact_prefix: models

  runtime:
    needs: images
    runs-on: depot-ubuntu-24.04
    environment: production
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ github.sha }}
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: gradiated-prod-model-artifacts-${{ vars.AWS_ACCOUNT_ID }}
      BASE_IMAGE: ${{ format('{0}.dkr.ecr.us-east-1.amazonaws.com/gradiated/prod/inference@{1}', vars.AWS_ACCOUNT_ID, fromJSON(needs.images.outputs.images)['nomad-base'].digest) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for infrastructure changes in this merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node tools/models/wait-infrastructure.mjs
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - id: existing
        run: node tools/models/release.mjs lookup "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.existing.outputs.exists != 'true'
        uses: depot/setup-action@v1
      - name: Package and verify the runtime
        if: steps.existing.outputs.exists != 'true'
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: product/inference
          file: product/inference/bundles/deepseek-v4-1-flash/Dockerfile
          platforms: linux/amd64
          build-contexts: runtime-base=docker-image://${{ env.BASE_IMAGE }}
          target: artifact
          outputs: type=local,dest=model-release
      - if: steps.existing.outputs.exists != 'true'
        run: node tools/models/release.mjs publish "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-runtime-release
          path: model-release/release.json
          retention-days: 30

  # Submission is enabled only after runtime-user, GPU, and recovery qualification.
  # A published base image does not replace a provider pod.
