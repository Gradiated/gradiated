name: Model deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - product/inference/gpu/**
      - product/inference/tailscale/**
      - product/inference/images/**
      - product/inference/CMakeLists.txt
      - product/inference/desmond/**
      - product/inference/engine/**
      - product/inference/.dockerignore
      - product/inference/bundles/**
      - product/inference/training/**
      - product/packages/autotrain
      - product/packages/autotrain/**
      - product/packages/contracts/src/training-recipe.json
      - product/inference/runtimes/kev/adapter.py
      - product/inference/runtimes/glm/**
      - product/inference/lora/**
      - product/inference/runtime-launcher/**
      - tools/images/**
      - tools/models/**
      - tools/virtual-kubelet/host_agent_test.py
      - tools/virtual-kubelet/host_state_test.py
      - infra/environments/prod/us-east-1/kubernetes/workloads/gateway.yaml
      - mise.toml
      - .github/workflows/model-deployment.yml
      - .github/workflows/build-images.yml
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: model-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/model-deployment.yml

  checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    outputs:
      bundles: ${{ steps.bundles.outputs.bundles }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: verification
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/models/verify-inputs.mjs "$BASE_SHA"
      # Only the training bundle builds from the private autotrain library, so
      # other pull requests, including Dependabot's, need no app key.
      - name: Read pinned autotrain revision
        id: autotrain
        if: contains(steps.verification.outputs.targets, 'verify-training')
        run: echo "revision=$(git rev-parse HEAD:product/packages/autotrain)" >> "$GITHUB_OUTPUT"
      - name: Create autotrain read token
        id: autotrain-token
        if: contains(steps.verification.outputs.targets, 'verify-training')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOTRAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOTRAIN_APP_PRIVATE_KEY }}
          owner: Gradiated
          repositories: autotrain
          permission-contents: read
      - name: Check out private training library
        if: contains(steps.verification.outputs.targets, 'verify-training')
        uses: actions/checkout@v7
        with:
          repository: Gradiated/autotrain
          ref: ${{ steps.autotrain.outputs.revision }}
          path: product/packages/autotrain
          token: ${{ steps.autotrain-token.outputs.token }}
          persist-credentials: false
      - run: |
          node --test tools/images/*.test.mjs tools/models/*.test.mjs
          bash product/inference/images/tests/test_launch.sh
      - id: bundles
        run: echo "bundles=$(node tools/models/release.mjs list)" >> "$GITHUB_OUTPUT"
      - uses: depot/setup-action@v1
        if: steps.verification.outputs.required == 'true'
      - name: Verify the complete runtime on pull requests
        if: steps.verification.outputs.required == 'true'
        uses: depot/bake-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          files: product/inference/bundles/build.hcl
          targets: ${{ steps.verification.outputs.targets }}

  images:
    needs: checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ github.sha }}
      images: '["gpu-base"]'
      artifact_prefix: models
      # The CUDA base inherits NVIDIA's package set; report its findings without
      # blocking model rollouts until a remediation policy for it exists.
      vulnerability_scan: report

  runtime:
    needs: [checks, images]
    runs-on: depot-ubuntu-24.04
    environment: production
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.checks.outputs.bundles) }}
    env:
      BUNDLE: ${{ matrix.bundle }}
      SOURCE_SHA: ${{ github.sha }}
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: gradiated-prod-model-artifacts-${{ vars.AWS_ACCOUNT_ID }}
      BASE_IMAGE: ${{ format('{0}.dkr.ecr.us-east-1.amazonaws.com/gradiated/prod/inference@{1}', vars.AWS_ACCOUNT_ID, fromJSON(needs.images.outputs.images)['gpu-base'].digest) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read pinned autotrain revision
        id: autotrain
        run: echo "revision=$(git rev-parse HEAD:product/packages/autotrain)" >> "$GITHUB_OUTPUT"
      - name: Create autotrain read token
        id: autotrain-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOTRAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOTRAIN_APP_PRIVATE_KEY }}
          owner: Gradiated
          repositories: autotrain
          permission-contents: read
      - name: Check out private training library
        uses: actions/checkout@v7
        with:
          repository: Gradiated/autotrain
          ref: ${{ steps.autotrain.outputs.revision }}
          path: product/packages/autotrain
          token: ${{ steps.autotrain-token.outputs.token }}
          persist-credentials: false
      - name: Wait for the source infrastructure prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/models/wait-infrastructure.mjs
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - id: existing
        run: node tools/models/release.mjs lookup "$BUNDLE" "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.existing.outputs.exists != 'true'
        uses: depot/setup-action@v1
      - name: Package and verify the runtime
        if: steps.existing.outputs.exists != 'true'
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: ${{ matrix.bundle == 'host' && '.' || (matrix.bundle == 'training' && 'product' || 'product/inference') }}
          file: ${{ matrix.bundle == 'training' && 'product/inference/training/Dockerfile' || format('product/inference/bundles/{0}/Dockerfile', matrix.bundle) }}
          platforms: linux/amd64
          build-contexts: runtime-base=docker-image://${{ env.BASE_IMAGE }}
          target: artifact
          outputs: type=local,dest=model-release
      - if: steps.existing.outputs.exists != 'true'
        run: node tools/models/release.mjs publish "$BUNDLE" "$SOURCE_SHA" "$BASE_IMAGE" "$ARTIFACT_BUCKET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}-runtime-release
          path: model-release/release.json
          retention-days: 30

  # Submission is enabled only after runtime-user, GPU, and recovery qualification.
  # A published base image does not replace a provider pod.

  passed:
    name: Model deployment passed
    if: always()
    needs: [changes, checks, images, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
