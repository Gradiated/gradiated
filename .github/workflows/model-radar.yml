name: Model radar

# Every 15 minutes, posts to #model-radar when a lab on the watch list
# publishes a new model on Hugging Face or OpenRouter.
# See tools/model-radar/README.md.
on:
  schedule:
    - cron: "*/15 * * * *"
  # A pull request that changes the radar gets a dry run against the real APIs.
  pull_request:
    paths:
      - ".github/workflows/model-radar.yml"
      - "tools/model-radar/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the alerts without posting to Slack or saving what was seen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('model-radar-{0}', github.ref) || 'model-radar' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}
  MODEL_RADAR_STATE: .agents/runtime/model-radar/seen.json

jobs:
  radar:
    name: Check for new models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node
      # The seen-IDs file lives in the Actions cache. A cache entry can't be
      # overwritten, so each run saves a new one and the next run restores the
      # newest. Pull requests can read main's entries but never save.
      - name: Restore the model IDs earlier runs saw
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MODEL_RADAR_STATE }}
          key: model-radar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-radar-
      - name: Scan Hugging Face and OpenRouter
        env:
          MODEL_RADAR_SLACK_WEBHOOK: ${{ secrets.MODEL_RADAR_SLACK_WEBHOOK }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node tools/model-radar/main.ts --dry-run
          else
            node tools/model-radar/main.ts
          fi
      # Saved even when a scan failed: the radar keeps a failed source's old
      # IDs and records the others, so nothing is alerted twice.
      - name: Save the model IDs for the next run
        if: always() && env.DRY_RUN != 'true' && hashFiles(env.MODEL_RADAR_STATE) != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MODEL_RADAR_STATE }}
          key: model-radar-${{ github.run_id }}-${{ github.run_attempt }}
