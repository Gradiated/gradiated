name: Nomad deployment

on:
  push:
    branches: [main]
    paths:
      - infra/environments/prod/us-east-1/kubernetes/nomad/**
      - infra/environments/prod/runpod/glm-5-3-flash/**
      - product/inference/runtimes/glm/**
      - product/inference/nomad/**
      - product/inference/desmond/**
      - product/inference/CMakeLists.txt
      - .mise/tasks/desmond/test
      - product/inference/runtime-launcher/**
      - product/inference/images/nomad-base/**
      - tools/nomad/**
      - infra/environments/prod/us-east-1/kubernetes/workloads/observability/model-replica-rules.yaml
      - .github/workflows/nomad-deployment.yml
  workflow_run:
    workflows: [Model deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nomad-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/nomad-deployment.yml

  configuration-checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'workflow_run'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - name: Test Desmond reporting and runtime ownership
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev python3 openssl
          bash .mise/tasks/desmond/test
      - name: Test GLM startup qualification
        run: python3 -m unittest discover -s product/inference/runtimes/glm -p 'test_warmup*.py'
      - run: |
          kubectl kustomize infra/environments/prod/us-east-1/kubernetes/nomad >/dev/null
          bash infra/environments/prod/us-east-1/kubernetes/nomad/tests/validate-servers.sh
          node --check tools/nomad/create-bootstrap-secrets.mjs
          bash product/inference/nomad/tests/validate-job.sh
          timeout 600 bash product/inference/nomad/tests/test-host-proxy.sh --recovery
          node --test tools/nomad/wait-deployments.test.mjs
      - uses: depot/setup-action@v1
      - name: Build and test the runtime launcher
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: product/inference
          file: product/inference/runtime-launcher/tests/Dockerfile
          target: tests
          platforms: linux/amd64

  deploy:
    name: Deploy jobs
    if: >-
      !cancelled() && needs.configuration-checks.result != 'failure' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: configuration-checks
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 125
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      NOMAD_ADDR: https://127.0.0.1:4646
      NOMAD_TLS_SERVER_NAME: server.global.nomad
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for infrastructure changes in this merge
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node tools/models/wait-infrastructure.mjs
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: nomad-deploy-${{ github.run_id }}
      - name: Join the tailnet for the Kubernetes API
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci
      - uses: jdx/mise-action@v4.2.3
      - name: Forward the Nomad API
        run: |
          aws eks update-kubeconfig --name gradiated-prod --region "$AWS_REGION"
          kubectl -n nomad port-forward svc/nomad-api 4646:4646 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 30); do
            (exec 3<>/dev/tcp/127.0.0.1/4646) 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/port-forward.log" >&2
          exit 1
      - name: Issue a Nomad client certificate for this deployment
        run: |
          tls="$RUNNER_TEMP/nomad-tls"
          pnpm --dir product install --frozen-lockfile --filter @gradiated/nomad-pki
          pnpm --dir product --filter @gradiated/nomad-pki certificate \
            --role cli --ca "$GITHUB_WORKSPACE/infra/environments/prod/us-east-1/kubernetes/nomad/ca.crt" --out "$tls"
          cp infra/environments/prod/us-east-1/kubernetes/nomad/ca.crt "$tls/ca.pem"
          {
            echo "NOMAD_CACERT=$tls/ca.pem"
            echo "NOMAD_CLIENT_CERT=$tls/cert.pem"
            echo "NOMAD_CLIENT_KEY=$tls/key.pem"
          } >>"$GITHUB_ENV"
      - name: Log in to Nomad with this workflow's identity
        run: |
          jwt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nomad.gradiated.com" | jq -er .value)"
          response="$(curl -sS -w '\n%{http_code}' --cacert "$NOMAD_CACERT" --cert "$NOMAD_CLIENT_CERT" --key "$NOMAD_CLIENT_KEY" \
            --connect-to "$NOMAD_TLS_SERVER_NAME:4646:127.0.0.1:4646" \
            -X POST "https://$NOMAD_TLS_SERVER_NAME:4646/v1/acl/login" \
            -d "$(jq -n --arg token "$jwt" '{AuthMethodName: "github-actions", LoginToken: $token}')")"
          if [[ "${response##*$'\n'}" != 200 ]]; then
            echo "Nomad login failed: ${response%$'\n'*}" >&2
            exit 1
          fi
          token="$(jq -er .SecretID <<<"${response%$'\n'*}")"
          echo "::add-mask::$token"
          echo "NOMAD_TOKEN=$token" >>"$GITHUB_ENV"
      - run: bash tools/nomad/deploy-jobs.sh

  passed:
    name: Nomad deployment passed
    if: always()
    needs: [changes, configuration-checks, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
