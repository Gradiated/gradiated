name: PostHog compensation data

# The Compensation handbook page's calculator uses PostHog's compensation
# data, pulled from the posthog.com repo when the website builds. Every Monday
# this compares PostHog's current data with the data the live site was built
# from and, if they differ, triggers the website's Vercel deploy hook.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posthog-compensation
  cancel-in-progress: false

jobs:
  redeploy-if-changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm
      # The sync script parses PostHog's files with the typescript package.
      - run: pnpm install --frozen-lockfile --filter gradiated-com
        working-directory: product
      - name: Compare PostHog's data with the live site
        id: check
        working-directory: product/website
        shell: bash
        run: |
          set +e
          node scripts/posthog-compensation-unchanged.ts
          status=$?
          set -e
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Trigger the website deploy hook
        if: steps.check.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_WEBSITE_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::VERCEL_WEBSITE_DEPLOY_HOOK is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
