name: Research lab

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - ".github/actions/rust-cache/**"
      - ".github/workflows/research-lab.yml"
      - "research/lab/**"
      - "mise.toml"
      - ".cargo/config.toml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/research-lab.yml

  rust:
    name: Rust (research/lab)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          scope: research-lab
          workspaces: research/lab
      - run: cargo fmt --all -- --check
        working-directory: research/lab
      - run: cargo test --workspace
        working-directory: research/lab
      - uses: ./.github/actions/rust-cache
        with:
          mode: save
          scope: research-lab
          workspaces: research/lab

  passed:
    name: Research lab passed
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
