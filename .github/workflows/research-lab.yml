name: Research lab

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - ".github/workflows/research-lab.yml"
      - "research/lab/**"
      - "mise.toml"
      - ".cargo/config.toml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/research-lab.yml

  rust:
    name: Rust (research/lab)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            research/lab/target
          key: ${{ runner.os }}-${{ runner.arch }}-research-rust-${{ hashFiles('research/lab/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-research-rust-${{ hashFiles('research/lab/Cargo.lock') }}-
      - run: cargo fmt --all -- --check
        working-directory: research/lab
      - run: cargo test --workspace
        working-directory: research/lab

  passed:
    name: Research lab passed
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
