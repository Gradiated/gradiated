name: Stage production images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit whose immutable images should be staged.
        required: true
        type: string
    outputs:
      product_digest:
        description: Staged product image digest.
        value: ${{ jobs.build-product.outputs.digest }}
      gateway_digest:
        description: Staged gateway image digest.
        value: ${{ jobs.build-gateway.outputs.digest }}

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gradiated-prod-deployment
  PRODUCT_REPOSITORY: gradiated/prod/product
  GATEWAY_REPOSITORY: gradiated/prod/gateway

jobs:
  build-product:
    name: Build product image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.resolve-image.outputs.digest }}
    env:
      IMAGE_TAG: git-${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: stage-product-${{ github.run_id }}
          retry-max-attempts: 20
          action-timeout-s: 900
      - id: existing
        name: Find existing immutable image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${PRODUCT_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.exists != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.existing.outputs.exists != 'true'
        name: Build and push product image
        uses: docker/build-push-action@v6
        with:
          context: product
          file: product/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PRODUCT_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=production-product
          cache-to: type=gha,mode=max,scope=production-product
      - id: resolve-image
        name: Resolve product digest
        shell: bash
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${PRODUCT_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR returned an invalid product digest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.resolve-image.outputs.digest }}
    env:
      IMAGE_TAG: git-${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: stage-gateway-${{ github.run_id }}
          retry-max-attempts: 20
          action-timeout-s: 900
      - id: existing
        name: Find existing immutable image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${GATEWAY_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.exists != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.existing.outputs.exists != 'true'
        name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: product/services/gateway
          file: product/services/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.GATEWAY_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=production-gateway
          cache-to: type=gha,mode=max,scope=production-gateway
      - id: resolve-image
        name: Resolve gateway digest
        shell: bash
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${GATEWAY_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR returned an invalid gateway digest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
