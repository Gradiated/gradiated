name: Product tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/application-deployment.yml"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/tests.yml"
      - "product/inference/CMakeLists.txt"
      - "product/inference/desmond/**"
      - "product/inference/engine/**"
      - "product/inference/gpu/**"
      - "product/inference/images/gpu-base/**"
      - "product/inference/host/**"
      - "product/inference/runtimes/kev/**"
      - "product/inference/runtimes/decider/**"
      - "product/inference/runtimes/vllm/**"
      - "product/packages/**"
      - ".github/actions/product-changes/**"
      - ".github/actions/relevant/**"
      - ".cargo/config.toml"
      - "product/scripts/**"
      - "product/services/api/**"
      - "product/services/console/**"
      - "product/services/gateway/**"
      - "product/services/proxy/**"
      - "product/services/collector/**"
      - "infra/environments/prod/us-east-1/kubernetes/workloads/proxy.yaml"
      - "infra/environments/prod/us-east-1/kubernetes/workloads/public-api.yaml"
      - "product/services/rust-service.Dockerfile"
      - "product/services/worker/**"
      - "product/services/temporal-worker/**"
      - "product/services/ops-mcp/**"
      - "product/services/gpu-fleet/**"
      - "product/.dockerignore"
      - "product/.nvmrc"
      - "product/.prettierignore"
      - "product/Dockerfile"
      - "product/docker-compose.yml"
      - "product/mprocs.yaml"
      - "product/package.json"
      - "product/pnpm-lock.yaml"
      - "product/pnpm-workspace.yaml"
      - "product/prettier.config.mjs"
      - "product/tsconfig.scripts.json"
      - "product/tsconfig.base.json"
      - "product/turbo.json"
      - "mise.toml"
      - "tools/ci/**"
      - ".github/actions/rust-cache/**"
      - "tools/images/**"
      - "tools/virtual-kubelet/**"
      - "tools/deployment/**"
      - "tools/docs-refresh/**"
      - "tools/model-radar/**"
      - "tools/github-apps/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: product-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      console_build: ${{ steps.plan.outputs.console_build }}
      images: ${{ steps.images.outputs.matrix }}
      image_checks: ${{ steps.images.outputs.required }}
      format: ${{ steps.plan.outputs.format }}
      unit: ${{ steps.plan.outputs.unit == 'true' && steps.reuse.outputs.reused != 'true' }}
      packages: ${{ steps.plan.outputs.packages }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      rust: ${{ steps.plan.outputs.rust }}
      integration: ${{ steps.plan.outputs.integration == 'true' && steps.reuse.outputs.reused != 'true' }}
      inference_native: ${{ steps.plan.outputs.inference_native == 'true' && steps.reuse.outputs.reused != 'true' }}
      native_cpp: ${{ steps.plan.outputs.native_cpp == 'true' && steps.reuse.outputs.reused != 'true' }}
      native_kev: ${{ steps.plan.outputs.native_kev == 'true' && steps.reuse.outputs.reused != 'true' }}
      gateway_contract: ${{ steps.plan.outputs.gateway_contract == 'true' && steps.reuse.outputs.reused != 'true' }}
      proxy_e2e: ${{ steps.plan.outputs.proxy_e2e == 'true' && steps.reuse.outputs.reused != 'true' }}
      backend_storage: ${{ steps.plan.outputs.backend_storage == 'true' && steps.reuse.outputs.reused != 'true' }}
      inference_e2e: ${{ steps.plan.outputs.inference_e2e == 'true' && steps.reuse.outputs.reused != 'true' }}
      playwright: ${{ steps.plan.outputs.playwright == 'true' && steps.reuse.outputs.reused != 'true' }}
      website: ${{ steps.plan.outputs.website == 'true' && steps.reuse.outputs.reused != 'true' }}
      tooling: ${{ steps.plan.outputs.tooling == 'true' && steps.reuse.outputs.reused != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/tests.yml
      - run: python3 -m pip install --quiet PyYAML==6.0.3
      - id: plan
        name: Select checks and affected workspace packages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/actions/product-changes/plan.py
      - id: images
        name: Select changed image inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/images/verified.mjs select "$BASE" "${{ github.sha }}"
      - id: reuse
        name: Find a passing CI round for identical inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PLAN: ${{ toJSON(steps.plan.outputs) }}
        run: python3 tools/ci/reuse.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: .agents/runtime/product-ci-inputs.json
          retention-days: 30
      - name: Test path selection, result reuse, and Rust caching
        run: |
          python3 -m unittest discover -s .github/actions/product-changes -v
          python3 .github/actions/rust-cache/test_cache.py
          python3 -m unittest discover -s tools/ci -p 'test_reuse.py' -v

  console-build:
    name: Verify production console build
    needs: changes
    if: needs.changes.outputs.console_build == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    env:
      VITE_API_URL: https://api.gradiated.com
      VITE_POSTHOG_KEY: ${{ vars.CONSOLE_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: prior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment/console-artifact.mjs find "${{ github.sha }}"
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        if: steps.prior.outputs.reused != 'true'
      - run: pnpm install --frozen-lockfile
        working-directory: product
        if: steps.prior.outputs.reused != 'true'
      - name: Build the production console before merge
        working-directory: product
        if: steps.prior.outputs.reused != 'true'
        run: |
          test -n "$VITE_POSTHOG_KEY"
          pnpm exec turbo run build --filter=@gradiated/console... --env-mode=loose
      - if: steps.prior.outputs.reused != 'true'
        run: node tools/deployment/console-artifact.mjs record "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prior.outputs.reused != 'true'
        with:
          name: ${{ steps.prior.outputs.artifact }}
          path: product/services/console/dist/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  image-checks:
    name: Image CI (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.image_checks == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find an already verified artifact for identical inputs
        id: prior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.name }}
        run: node tools/images/verified.mjs find "$IMAGE_NAME" "${{ github.sha }}"
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        if: steps.prior.outputs.reused != 'true'
      - name: Prepare image output
        if: steps.prior.outputs.reused != 'true'
        run: mkdir -p ci-image
      - name: Build the candidate image
        if: steps.prior.outputs.reused != 'true'
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-contexts: ${{ matrix.buildContexts }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: type=oci,dest=ci-image/image.tar
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        if: steps.prior.outputs.reused != 'true'
        with:
          install_args: trivy
      - name: Scan the candidate image before merge
        if: steps.prior.outputs.reused != 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          # Trivy accepts OCI layout directories, not OCI tar archives:
          # https://trivy.dev/docs/v0.75/guide/target/container_image/#oci-layout
          layout=$(mktemp -d)
          trap 'rm -rf "$layout"' EXIT
          tar -xf ci-image/image.tar -C "$layout"
          trivy image --quiet --input "$layout" --scanners vuln --severity CRITICAL,HIGH --ignorefile .trivyignore --format json --output image-scan.json
          gate=()
          if [[ "$IMAGE_NAME" != gpu-base ]]; then gate=(--enforce); fi
          python3 tools/security/scan_report.py trivy image-scan.json --name "$IMAGE_NAME" "${gate[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bind the verified archive to its source inputs
        if: steps.prior.outputs.reused != 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: node tools/images/verified.mjs record "$IMAGE_NAME" "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prior.outputs.reused != 'true'
        with:
          name: ${{ steps.prior.outputs.artifact }}
          path: ci-image/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  format:
    name: Product formatting
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - run: pnpm format:check
        working-directory: product

  unit:
    name: Unit (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: ${{ matrix.target_minutes }} minutes; the timeout is only a runaway guard.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Install Rust check components
        if: matrix.rust
        run: rustup component add rustfmt clippy
      - uses: ./.github/actions/rust-cache
        if: matrix.rust
        with:
          scope: unit-${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Run this workspace's checks
        working-directory: product
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
        run: |
          mapfile -t filters < <(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES")
          /usr/bin/time -f "CI timing: wall=%e cpu=%P user=%U system=%S max_rss_kb=%M" pnpm turbo run check --env-mode=loose --force "${filters[@]}"
      - uses: ./.github/actions/rust-cache
        if: github.ref == 'refs/heads/main' && matrix.rust
        with:
          mode: save
          scope: unit-${{ matrix.name }}

  website:
    name: Website build and SEO
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - run: pnpm --filter gradiated-com test
        working-directory: product
      - run: pnpm --filter gradiated-com build
        working-directory: product

  tooling:
    name: Product and deployment tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    # Performance target: 5 minutes; the timeout is only a runaway guard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: node --test tools/deployment/*.test.mjs tools/docs-refresh/*.test.mjs tools/github-apps/*.test.mjs tools/images/*.test.mjs tools/model-radar/*.test.ts
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - run: pnpm --filter @gradiated/control... build
        working-directory: product
      - run: pnpm exec tsc -p ../tools/model-radar/tsconfig.json
        working-directory: product
      - run: pnpm check:scripts && pnpm test:scripts && pnpm exec prettier --check mprocs.yaml scripts
        working-directory: product

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: ./.github/actions/rust-cache
        with:
          scope: gateway-integration
      - name: Start product dependency stack
        working-directory: product
        run: |
          docker compose up -d postgres valkey clickhouse
          docker compose run --rm valkey-cluster-init
          docker compose up -d --wait postgres valkey clickhouse
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Migrate PostgreSQL
        working-directory: product
        env:
          DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
        run: pnpm --filter @gradiated/control db:migrate
      - name: Run integration tests
        working-directory: product/services/gateway
        run: "mise exec -- cargo test --locked -- --ignored serving_state:: postgres_reader::"
      - name: Show dependency logs on failure
        if: failure()
        working-directory: product
        run: docker compose logs --no-color
      - name: Stop product dependency stack
        if: always()
        working-directory: product
        run: docker compose down --volumes
      - uses: ./.github/actions/rust-cache
        if: github.ref == 'refs/heads/main'
        with:
          mode: save
          scope: gateway-integration

  inference-native:
    name: Inference native tests
    needs: changes
    if: needs.changes.outputs.inference_native == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install native toolchain
        if: needs.changes.outputs.native_cpp == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libcurl4-openssl-dev python3 openssl
      - name: Build Desmond and the engine with sanitizers
        if: needs.changes.outputs.native_cpp == 'true'
        run: |
          cmake -S product/inference -B build/inference -DCMAKE_BUILD_TYPE=Debug -DDESMOND_ENABLE_SANITIZERS=ON
          cmake --build build/inference -j "$(nproc)"
      - name: Run Desmond and engine tests
        if: needs.changes.outputs.native_cpp == 'true'
        working-directory: build/inference
        run: ctest --output-on-failure --parallel "$(nproc)"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: needs.changes.outputs.native_kev == 'true'
      - name: Run decision runtime CPU unit tests
        if: needs.changes.outputs.native_kev == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --no-project --python 3.12
          --with fastapi --with httpx --with pytest
          python -m pytest -p no:cacheprovider product/inference/runtimes/kev product/inference/runtimes/decider -q

  gateway-contract:
    name: Gateway runtime integration
    needs: changes
    if: needs.changes.outputs.gateway_contract == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: ./.github/actions/rust-cache
        with:
          scope: gateway-contract
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build actual gateway binary
        run: cargo build --locked --manifest-path product/services/gateway/Cargo.toml
      - name: Pull disposable serving-state image
        run: docker pull valkey/valkey:8.1.9-alpine3.24
      # Fork and Dependabot runs get no secrets, so they skip the live OpenRouter tests.
      - name: Require the live OpenRouter key
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          OPENROUTER_LIVE_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
        run: test -n "$OPENROUTER_LIVE_API_KEY" || { echo "::error::The OPENROUTER_CI_API_KEY Actions secret is not set"; exit 1; }
      - name: Exercise gateway against Kev, vLLM and OpenRouter peers
        working-directory: product
        env:
          OPENROUTER_LIVE_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
        run: >-
          pnpm --filter @gradiated/gateway exec vitest run
          --reporter=default --reporter=junit
          --outputFile.junit=../../../.agents/runtime/gateway-integration.xml
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-runtime-integration
          path: .agents/runtime/gateway-integration.xml
          if-no-files-found: ignore
          retention-days: 7

  proxy-e2e:
    name: Proxy E2E
    needs: changes
    if: needs.changes.outputs.proxy_e2e == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: ./.github/actions/rust-cache
        with:
          scope: gateway-contract
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build the proxy and gateway binaries
        run: |
          cargo build --locked --manifest-path product/services/gateway/Cargo.toml
          cargo build --locked --manifest-path product/services/proxy/Cargo.toml
      - name: Pull disposable serving-state image
        run: docker pull valkey/valkey:8.1.9-alpine3.24
      - name: Exercise the proxy in front of the gateway
        working-directory: product
        run: >-
          pnpm --filter @gradiated/proxy exec vitest run
          --reporter=default --reporter=junit
          --outputFile.junit=../../../.agents/runtime/proxy-e2e.xml
      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proxy-e2e
          path: |
            .agents/runtime/proxy-e2e.xml
            .agents/runtime/proxy-e2e/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/rust-cache
        if: github.ref == 'refs/heads/main'
        with:
          mode: save
          scope: gateway-contract

  backend-storage:
    name: Backend storage integration
    needs: changes
    if: needs.changes.outputs.backend_storage == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: ./.github/actions/rust-cache
        with:
          scope: proxy-e2e
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build backend dependencies
        working-directory: product
        run: pnpm turbo run build --filter='@gradiated/worker^...'
      - name: Run worker ingestion and settlement against real Valkey and ClickHouse
        working-directory: product
        run: pnpm --filter @gradiated/worker test:integration
      - name: Run proxy capture through the collector and S3-compatible storage
        working-directory: product
        run: pnpm --filter @gradiated/collector test:integration

  inference-e2e:
    name: Inference E2E Tests
    needs: changes
    if: needs.changes.outputs.inference_e2e == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - uses: ./.github/actions/rust-cache
        with:
          scope: gateway-contract
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build actual gateway binary
        run: cargo build --locked --manifest-path product/services/gateway/Cargo.toml
      - name: Pull disposable serving-state image
        run: docker pull valkey/valkey:8.1.9-alpine3.24
      # Both runtime images carry their weights, so nothing is downloaded at run
      # time. Depot caches the layers, so an unchanged Dockerfile rebuilds nothing.
      - name: Build the CPU LLM runtime
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: product/inference/runtimes/vllm
          file: product/inference/runtimes/vllm/Dockerfile.cpu
          platforms: linux/amd64
          load: true
          tags: gradiated/vllm-cpu:ci
      - name: Build the CPU decision runtime
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: product/inference/runtimes/kev
          file: product/inference/runtimes/kev/Dockerfile.cpu
          platforms: linux/amd64
          load: true
          tags: gradiated/kev-cpu:ci
      - name: Run the gateway against real CPU runtimes
        working-directory: product
        env:
          GATEWAY_REAL_RUNTIME: vllm,kev
        run: >-
          pnpm --filter @gradiated/gateway exec vitest run
          --reporter=default --reporter=junit
          --outputFile.junit=../../../.agents/runtime/inference-e2e.xml
      - name: Upload inference E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inference-e2e
          path: .agents/runtime/inference-e2e.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/rust-cache
        if: github.ref == 'refs/heads/main'
        with:
          mode: save
          scope: proxy-e2e

  playwright:
    name: Playwright tests
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: depot-ubuntu-24.04
    # Performance target: 10 minutes; the timeout is only a runaway guard.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build browser-test dependencies
        working-directory: product
        run: >-
          pnpm turbo run build
          --filter=@gradiated/api
          --filter=@gradiated/console
          --env-mode=loose
          --force
      - name: Install browser
        working-directory: product
        run: pnpm --filter @gradiated/console exec playwright install --with-deps chromium
      - name: Start product dependency stack
        working-directory: product
        run: |
          docker compose up -d postgres valkey clickhouse
          docker compose run --rm valkey-cluster-init
          docker compose up -d --wait postgres valkey clickhouse
      - name: Migrate PostgreSQL
        working-directory: product
        env:
          DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
        run: pnpm --filter @gradiated/control db:migrate
      - name: Migrate ClickHouse
        working-directory: product
        env:
          CLICKHOUSE_DATABASE: gradiated
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_SECURE: "false"
          CLICKHOUSE_ADMIN_USERNAME: gradiated
          CLICKHOUSE_ADMIN_PASSWORD: gradiated
          CLICKHOUSE_APPLICATION_USERNAME: gradiated
          CLICKHOUSE_APPLICATION_PASSWORD: gradiated
          CLICKHOUSE_METABASE_USERNAME: metabase
          CLICKHOUSE_METABASE_PASSWORD: gradiated
        run: pnpm --filter @gradiated/control clickhouse:migrate
      - name: Verify production MCP browser login
        working-directory: product
        run: pnpm --filter @gradiated/ops-mcp exec playwright test
      - name: Run Playwright tests
        working-directory: product
        run: pnpm --filter @gradiated/console exec playwright test
      - name: Verify training and live trace data UI
        working-directory: product
        env:
          VITE_FEATURE_FLAGS: training
        run: pnpm --filter @gradiated/console exec playwright test traces.spec.ts training.spec.ts
      - name: Verify task reloads, skeletons, settings and held-out results
        working-directory: product
        run: pnpm --filter @gradiated/console exec playwright test --config playwright.task-ui.config.ts
      - name: Show dependency logs on failure
        if: failure()
        working-directory: product
        run: docker compose logs --no-color
      - name: Stop product dependency stack
        if: always()
        working-directory: product
        run: docker compose down --volumes

  passed:
    name: Product tests passed
    if: always()
    needs:
      [
        changes,
        image-checks,
        console-build,
        format,
        unit,
        website,
        tooling,
        integration,
        inference-native,
        gateway-contract,
        proxy-e2e,
        backend-storage,
        inference-e2e,
        playwright,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
