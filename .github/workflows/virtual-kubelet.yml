name: GPU controller tests
on:
  push:
    branches: [main]
    paths: ["tools/virtual-kubelet/**", "tools/gpu/**", "infra/environments/prod/us-east-1/kubernetes/gpu-inference/**", "infra/environments/prod/us-east-1/kubernetes/tailscale-inference/hosts/**", "product/inference/gpu/**", ".github/workflows/virtual-kubelet.yml"]
  pull_request:
    paths: ["tools/virtual-kubelet/**", "tools/gpu/**", "infra/environments/prod/us-east-1/kubernetes/gpu-inference/**", "infra/environments/prod/us-east-1/kubernetes/tailscale-inference/hosts/**", "product/inference/gpu/**", ".github/workflows/virtual-kubelet.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.13"
          cache-dependency-path: tools/virtual-kubelet/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: tools/virtual-kubelet
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 tools/gpu/render-config.py --check
      - run: python3 tools/gpu/render_config_test.py
      - run: python3 tools/virtual-kubelet/host_agent_test.py
      - run: python3 tools/virtual-kubelet/host_state_test.py
      - run: python3 product/inference/gpu/bootstrap_test.py
      - run: python3 product/inference/images/gpu-base/download_runtime_test.py
      - run: test -z "$(gofmt -l tools/virtual-kubelet/cmd/gpu-controller/*.go)"
      - run: docker build tools/virtual-kubelet
