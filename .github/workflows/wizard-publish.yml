name: Wizard publish

on:
  push:
    branches: [main]
    paths:
      - "product/services/wizard/**"
      - ".github/workflows/wizard-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wizard-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @gradiated/wizard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4.2.3
      # Trusted publishing with OIDC needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1 opencode-ai @openai/codex
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build and verify
        working-directory: product
        run: pnpm turbo run build check --filter=@gradiated/wizard --env-mode=loose --force
      - name: Publish with OIDC trusted publishing
        working-directory: product/services/wizard
        run: npm publish --access public

  e2e:
    name: Wizard e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The repository contains source paths longer than the Windows default
      # limit; lift it before checkout on Windows runners.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4.2.3
      - run: npm install -g npm@^11.5.1 opencode-ai @openai/codex
      - name: Show the clients the tests will use
        run: |
          opencode --version
          codex --version
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build and test on a fresh home
        working-directory: product
        run: pnpm turbo run build check --filter=@gradiated/wizard --env-mode=loose --force
