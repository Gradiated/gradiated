name: Wizard publish

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/relevant/**"
      - "product/services/wizard/**"
      - ".github/workflows/wizard-publish.yml"
      - "product/.nvmrc"
      - "product/package.json"
      - "product/pnpm-lock.yaml"
      - "product/pnpm-workspace.yaml"
      - "product/prettier.config.mjs"
      - "product/tsconfig.base.json"
      - "product/turbo.json"
      - "mise.toml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wizard-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: relevant
        uses: ./.github/actions/relevant
        with:
          workflow: .github/workflows/wizard-publish.yml

  publish:
    name: Publish @gradiated/wizard
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # Trusted publishing with OIDC needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1 opencode-ai @openai/codex @anthropic-ai/claude-code
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build and verify
        working-directory: product
        run: |
          pnpm turbo run build check --filter=@gradiated/wizard --env-mode=loose --force
          pnpm exec prettier --check services/wizard
      - name: Publish with OIDC trusted publishing
        working-directory: product/services/wizard
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@gradiated/wizard@$VERSION" version > /dev/null 2>&1; then
            echo "@gradiated/wizard@$VERSION is already published; skipping"
          else
            npm publish --access public
          fi

  e2e:
    name: Wizard e2e (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The repository contains source paths longer than the Windows default
      # limit; lift it before checkout on Windows runners.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # The e2e tests drive the latest released codex, opencode and Claude
      # Code against the wizard output; runners are fresh, so this is always
      # a first install of each client.
      - run: npm install -g npm@^11.5.1 opencode-ai @openai/codex @anthropic-ai/claude-code
      - name: Show the clients the tests will use
        run: |
          opencode --version
          codex --version
          claude --version
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Build and test on a fresh home
        working-directory: product
        run: pnpm turbo run build check --filter=@gradiated/wizard --env-mode=loose --force
      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: product
        run: pnpm exec prettier --check services/wizard

  passed:
    name: Wizard publish passed
    if: always()
    needs: [changes, publish, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
