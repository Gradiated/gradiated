[workspace]
resolver = "2"
members = ["crates/spec", "crates/perf", "crates/cost", "crates/engine", "crates/cli"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-dbg]
inherits = "release"
debug = true
