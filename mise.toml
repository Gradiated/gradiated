[tools]
aws = "2.36.24"
gitleaks = "8.30.1"
helm = "4.2.4"
kubectl = "1.36.3"
kubeconform = "0.7.0"
node = "22.23.2"
pnpm = "10.34.5"
rust = "1.97.1"
terraform = "1.14.6"
terragrunt = "1.1.2"
trivy = "0.75.0"

[tasks."aws:login"]
description = "Log in to Gradiated AWS through the configured organization SSO profile"
run = "aws sso login --profile gradiated-admin"

[tasks.infra-fmt]
description = "Format Terraform and Terragrunt configuration"
run = [
  "terraform fmt -recursive infra",
  "terragrunt hcl fmt --working-dir infra/environments/prod/us-east-1/terraform",
]

[tasks.infra-check]
description = "Run credential-free infrastructure formatting and HCL checks"
depends = ["infra-fmt"]
run = [
  "terraform fmt -check -recursive infra",
  "terragrunt hcl fmt --check --working-dir infra/environments/prod/us-east-1/terraform",
  "terragrunt hcl validate --working-dir infra/environments/prod/us-east-1/terraform",
  "git diff --check",
]

[tasks.infra-sec]
description = "Report security misconfigurations in the standalone bootstrap roots with Trivy"
run = "trivy config --quiet --exit-code 1 infra/bootstrap"

[tasks."github-apps:create"]
description = "Create Gradiated GitHub Apps and store their keys without printing them"
run = "node tools/github-apps/create.mjs"

[tasks.sglang-local]
description = "Run the pinned Apple Silicon SGLang development model"
dir = "product"
run = "./scripts/run-sglang-local.sh"
