[tools]
# The repository's Python tools and gradctl run on this Python. Installing it
# also installs tools/python-requirements.txt into it. Linux and macOS only: the
# hook is POSIX shell, and Windows CI jobs (wizard e2e) keep the runner's Python.
python = { version = "3.13.18", postinstall = "\"$MISE_TOOL_INSTALL_PATH/bin/python3\" -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r tools/python-requirements.txt", os = ["linux", "macos"] }
# gradctl compute uses it for Nebius VMs. Nebius publishes no registry entry, so
# this fetches its pinned release binary directly. Nebius builds no Windows binary.
"http:nebius" = { version = "0.12.306", url = "https://artifacts.nebius.cloud/cli/release/{{ version }}/{{ os(macos='darwin') }}/{{ arch(x64='x86_64') }}/nebius", bin = "nebius", os = ["linux", "macos"] }
aws = "2.36.24"
gitleaks = "8.30.1"
helm = "4.2.4"
kubectl = "1.36.3"
kubeconform = "0.7.0"
node = "22.23.4"
pnpm = "10.34.5"
rust = "1.97.1"
terraform = "1.14.6"
terragrunt = "1.1.2"
trivy = "0.75.0"

[env]
# `gradctl` from this checkout is on PATH wherever mise is active here
# (`mise activate`, `mise exec`, `mise run`), so it needs no install.
_.path = ["{{config_root}}/tools/gradctl"]

[tasks."python:deps"]
description = "Install tools/python-requirements.txt into the mise Python (after changing it)"
run = "python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r tools/python-requirements.txt"

[tasks."gradctl:install"]
description = "Install gradctl as one file at ~/.local/bin/gradctl, for use outside a checkout"
run = "python3 tools/gradctl/build.py --install"

[tasks.infra-fmt]
description = "Format Terraform and Terragrunt configuration"
run = [
  "terraform fmt -recursive infra",
  "terragrunt hcl fmt --working-dir infra/environments/prod/us-east-1/terraform",
]

[tasks.infra-check]
description = "Run credential-free infrastructure formatting and HCL checks"
depends = ["infra-fmt"]
run = [
  "terraform fmt -check -recursive infra",
  "terragrunt hcl fmt --check --working-dir infra/environments/prod/us-east-1/terraform",
  "terragrunt hcl validate --working-dir infra/environments/prod/us-east-1/terraform",
  "git diff --check",
]

[tasks.infra-sec]
description = "Report security misconfigurations in the standalone bootstrap roots with Trivy"
run = "trivy config --quiet --exit-code 1 infra/bootstrap"

[tasks.sglang-local]
description = "Run the pinned Apple Silicon SGLang development model"
dir = "product"
run = "./scripts/run-sglang-local.sh"
