name: gradiated

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: gradiated
      POSTGRES_USER: gradiated
      POSTGRES_PASSWORD: gradiated
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradiated -d gradiated"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "/data/nodes.conf",
        "--cluster-node-timeout",
        "5000",
        "--cluster-announce-ip",
        "127.0.0.1",
        "--cluster-announce-port",
        "6379",
      ]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "valkey-cli cluster info | grep -q 'cluster_state:ok'"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey-cluster-init:
    image: valkey/valkey:8.1.9-alpine3.24
    depends_on:
      valkey:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        attempts=0
        until valkey-cli -h valkey ping >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 60 ] || exit 1
          sleep 1
        done
        if ! valkey-cli -h valkey cluster info | grep -q 'cluster_slots_assigned:16384'; then
          valkey-cli -h valkey cluster addslotsrange 0 16383
        fi
        valkey-cli -h valkey cluster info | grep -q 'cluster_slots_assigned:16384'
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1-alpine
    environment:
      CLICKHOUSE_DB: gradiated
      CLICKHOUSE_USER: gradiated
      CLICKHOUSE_PASSWORD: gradiated
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "gradiated",
          "--password",
          "gradiated",
          "--query",
          "select 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  clickhouse-data:
  postgres-data:
  valkey-data:
