[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gradiated-livetune"
version = "0.1.0"
description = "Live SGLang settings, a traffic-driven controller and a tuner"
requires-python = ">=3.12"

[project.entry-points."sglang.srt.plugins"]
livetune = "livetune.sglang_plugin:register"

[tool.setuptools]
packages = ["livetune"]
