[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradiated-lora-resolver"
version = "0.1.0"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
gradiated_lora = "vllm_resolver:register"

[tool.setuptools]
py-modules = ["vllm_resolver"]
