procs:
  datastores:
    shell: "docker compose up"
    stop:
      send-keys: ["<C-c>"]
  api:
    # The repository .env may carry deployed auth origins; local sign-in keeps these.
    shell: "scripts/with-root-env.sh BETTER_AUTH_URL TRUSTED_ORIGINS DATABASE_URL VALKEY_URL TRAINING_EXECUTOR TEMPORAL_ADDRESS TEMPORAL_NAMESPACE CONTENTS_BUCKET AWS_ENDPOINT_URL_S3 AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN -- mise exec -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE pnpm --filter @gradiated/api dev"
    env:
      <<: &contents_env
        CONTENTS_BUCKET: gradiated-local-contents
        AWS_ENDPOINT_URL_S3: http://127.0.0.1:8333
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: gradiated-local
        AWS_SECRET_ACCESS_KEY: gradiated-local-secret
        AWS_SESSION_TOKEN: ""
      DATABASE_URL: &database_url postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
      AUTH_TEST_MODE: "true"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-only-not-secret-change-in-production-0001
      TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      NODE_ENV: development
      PORT: "3001"
      TRAINING_EXECUTOR: mock
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      VALKEY_URL: &valkey_url redis://127.0.0.1:6379
      CLICKHOUSE_DATABASE: &clickhouse_database gradiated
      CLICKHOUSE_HOST: &clickhouse_host 127.0.0.1
      CLICKHOUSE_PASSWORD: gradiated
      CLICKHOUSE_PORT: &clickhouse_port "8123"
      CLICKHOUSE_SECURE: &clickhouse_secure "false"
      CLICKHOUSE_USERNAME: gradiated
  worker:
    shell: "mise exec -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE pnpm --filter @gradiated/worker dev"
    env:
      <<: *contents_env
      CLICKHOUSE_DATABASE: *clickhouse_database
      CLICKHOUSE_HOST: *clickhouse_host
      CLICKHOUSE_PASSWORD: gradiated
      CLICKHOUSE_PORT: *clickhouse_port
      CLICKHOUSE_SECURE: *clickhouse_secure
      CLICKHOUSE_USERNAME: gradiated
      DATABASE_URL: *database_url
      METRICS_PORT: "9465"
      VALKEY_URL: *valkey_url
      WORKER_CONSUMER_NAME: local-worker-1
  temporal-ui:
    shell: "./scripts/run-temporal-ui-local.sh"
    autostart: false
    stop: SIGTERM
  temporal-worker:
    shell: "mise exec -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE pnpm --filter @gradiated/temporal-worker dev"
    autostart: false
    env:
      <<: *contents_env
      DATABASE_URL: *database_url
      TRAINING_EXECUTOR: mock
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      METRICS_PORT: "9466"
  gateway:
    shell: "mise exec -- cargo run --manifest-path services/gateway/Cargo.toml --locked"
    env:
      DATABASE_URL: *database_url
      GATEWAY_BIND_ADDRESS: 127.0.0.1:3002
      GATEWAY_GENERATION_TIMEOUT_SECONDS: "630"
      GATEWAY_BROWSER_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GATEWAY_SETTLEMENT_BACKLOG_LIMIT: "100000"
      VALKEY_URL: *valkey_url
  proxy:
    shell: "mise exec -- cargo run --manifest-path services/proxy/Cargo.toml --locked"
    env:
      DATABASE_URL: *database_url
      PROXY_BIND_ADDRESS: 127.0.0.1:3003
      PROXY_ADMIN_ADDRESS: 127.0.0.1:9003
      PROXY_GATEWAY_ORIGIN: http://127.0.0.1:3002
      PROXY_COLLECTOR_URL: http://127.0.0.1:3004/v1/contents
      PROXY_COLLECTOR_TOKEN: &collector_token local-development-token-0123456789
  collector:
    shell: "mise exec -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE cargo run --manifest-path services/collector/Cargo.toml --locked"
    env:
      <<: *contents_env
      DATABASE_URL: *database_url
      COLLECTOR_BIND_ADDRESS: 127.0.0.1:3004
      COLLECTOR_ADMIN_ADDRESS: 127.0.0.1:9004
      COLLECTOR_BUCKET: gradiated-local-contents
      COLLECTOR_DATA_DIR: ../.agents/runtime/collector
      COLLECTOR_TOKEN: *collector_token
      COLLECTOR_REPLICA: local
      COLLECTOR_MAX_BATCH_SECONDS: "2"
      AWS_ALLOW_HTTP: "true"
  sglang:
    shell: "mise run sglang-local"
    autostart: false
    stop: SIGINT
  console:
    shell: "scripts/with-root-env.sh -- mise exec -- pnpm --filter @gradiated/console dev"
    env:
      # PostHog "Development" project (a public client token); the root .env can override it.
      VITE_POSTHOG_KEY: phc_umjFzXmQDsCr89BAGzpegeqe64WgrLuvEH9tvKB3qA2H
  website:
    shell: "mise exec -- pnpm --dir website dev"
    autostart: false
  migrate-postgres:
    shell: "mise exec -- pnpm --filter @gradiated/control db:migrate"
    autostart: false
    env:
      DATABASE_URL: *database_url
  migrate-clickhouse:
    shell: "mise exec -- pnpm --filter @gradiated/control clickhouse:migrate"
    autostart: false
    env:
      CLICKHOUSE_ADMIN_PASSWORD: gradiated
      CLICKHOUSE_ADMIN_USERNAME: gradiated
      CLICKHOUSE_APPLICATION_PASSWORD: gradiated
      CLICKHOUSE_APPLICATION_USERNAME: gradiated
      CLICKHOUSE_DATABASE: *clickhouse_database
      CLICKHOUSE_HOST: *clickhouse_host
      CLICKHOUSE_PORT: *clickhouse_port
      CLICKHOUSE_SECURE: *clickhouse_secure
  seed:
    shell: "mise exec -- pnpm --filter @gradiated/api seed"
    autostart: false
    env:
      DATABASE_URL: *database_url
      SEED_API_URL: http://127.0.0.1:3001
      VALKEY_URL: *valkey_url
  stripe-listen:
    shell: "stripe listen --forward-to http://localhost:3001/api/webhooks/stripe"
    autostart: false
    stop: SIGINT
