procs:
  datastores:
    shell: "docker compose up postgres valkey valkey-cluster-init clickhouse"
    stop:
      send-keys: ["<C-c>"]
  api:
    shell: >-
      zsh -lc 'gradiated_local_auth_url="$BETTER_AUTH_URL"; gradiated_local_trusted_origins="$TRUSTED_ORIGINS"; set -a; if [[ -f ../.env ]]; then source ../.env; fi; if [[ -f ../.env.local ]]; then source ../.env.local; fi; set +a; export BETTER_AUTH_URL="$gradiated_local_auth_url" TRUSTED_ORIGINS="$gradiated_local_trusted_origins"; source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/api dev'
    env:
      DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
      AUTH_TEST_MODE: "true"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-only-not-secret-change-in-production-0001
      TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      NODE_ENV: development
      PORT: "3001"
      VALKEY_URL: redis://127.0.0.1:6379
      CLICKHOUSE_DATABASE: gradiated
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PASSWORD: gradiated
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USERNAME: gradiated
  worker:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/worker dev'
    env:
      CLICKHOUSE_DATABASE: gradiated
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PASSWORD: gradiated
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USERNAME: gradiated
      DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
      METRICS_PORT: "9465"
      VALKEY_URL: redis://127.0.0.1:6379
      WORKER_CONSUMER_NAME: local-worker-1
  gateway:
    shell: "mise exec -- cargo run --manifest-path services/gateway/Cargo.toml --locked"
    env:
      GATEWAY_BIND_ADDRESS: 127.0.0.1:3002
      GATEWAY_GENERATION_TIMEOUT_SECONDS: "300"
      GATEWAY_BROWSER_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GATEWAY_SETTLEMENT_BACKLOG_LIMIT: "100000"
      VALKEY_URL: redis://127.0.0.1:6379
  sglang:
    shell: "mise run sglang-local"
    autostart: false
    stop: SIGINT
  console:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/console dev'
  website:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && cd website && corepack pnpm dev'
    autostart: false
  migrate-postgres:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/control db:migrate'
    autostart: false
    env:
      DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
  migrate-clickhouse:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/control clickhouse:migrate'
    autostart: false
    env:
      CLICKHOUSE_ADMIN_PASSWORD: gradiated
      CLICKHOUSE_ADMIN_USERNAME: gradiated
      CLICKHOUSE_APPLICATION_PASSWORD: gradiated
      CLICKHOUSE_APPLICATION_USERNAME: gradiated
      CLICKHOUSE_DATABASE: gradiated
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
  seed:
    shell: >-
      zsh -lc 'source "$NVM_DIR/nvm.sh" && nvm use >/dev/null && corepack pnpm --filter @gradiated/api seed'
    autostart: false
    env:
      DATABASE_URL: postgresql://gradiated:gradiated@127.0.0.1:5432/gradiated
      SEED_API_URL: http://127.0.0.1:3001
      VALKEY_URL: redis://127.0.0.1:6379
  stripe-listen:
    shell: "stripe listen --forward-to http://localhost:3001/api/webhooks/stripe"
    autostart: false
    stop: SIGINT
