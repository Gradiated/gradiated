[package]
name = "gradiated-credentials"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97"

[dependencies]
aws-sdk-secretsmanager = { version = "=1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
