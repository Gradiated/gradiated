packages:
  - "packages/*"
  - "services/*"
  - "website"

# A version must be published for 7 days (in minutes) before it can be installed.
# The repository-root .cargo/config.toml applies the same rule to Rust crates.
minimumReleaseAge: 10080

# Approved security release-age exceptions for the patched versions only.
minimumReleaseAgeExclude:
  # CVE-2026-115905: SDK 1.25.0 contains zip 9.0.5 in the native bridge.
  - "@temporalio/activity@1.25.0"
  - "@temporalio/client@1.25.0"
  - "@temporalio/common@1.25.0"
  - "@temporalio/core-bridge@1.25.0"
  - "@temporalio/nexus@1.25.0"
  - "@temporalio/proto@1.25.0"
  - "@temporalio/testing@1.25.0"
  - "@temporalio/worker@1.25.0"
  - "@temporalio/workflow@1.25.0"
  - "body-parser@2.4.0"
  - "zod@4.6.6"
  # First-party: Gradiated's training SDK (no dependencies), released from Gradiated/grad.
  - "@gradiated/grad@0.2.0-alpha.3"
  # Temporal 1.25.0 carries zip 9.0.5, fixing CVE-2026-115905.
  - "@temporalio/activity@1.25.0"
  - "@temporalio/client@1.25.0"
  - "@temporalio/common@1.25.0"
  - "@temporalio/core-bridge@1.25.0"
  - "@temporalio/nexus@1.25.0"
  - "@temporalio/proto@1.25.0"
  - "@temporalio/testing@1.25.0"
  - "@temporalio/worker@1.25.0"
  - "@temporalio/workflow@1.25.0"
