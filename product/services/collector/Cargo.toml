[package]
name = "gradiated-collector"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97"

[profile.release]
panic = "abort"

[dependencies]
axum = "0.8.4"
bytes = "1.12.1"
chrono = { version = "0.4.41", features = ["serde"] }
envy = "0.4.2"
object_store = { version = "=0.14.2", default-features = false, features = ["aws", "fs"] }
prometheus-client = "=0.25.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tower = { version = "0.5.2", features = ["limit"] }
tokio = { version = "1.45.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }
zstd = "=0.14.0"

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "=3.27.0"
tower = { version = "0.5.2", features = ["limit", "util"] }
