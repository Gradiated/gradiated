[package]
name = "gradiated-gateway"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97"

[dependencies]
async-trait = "0.1.88"
aws-config = { version = "=1.10.1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "=1.3.0"
aws-sdk-secretsmanager = { version = "=1.118.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "=1.6.0"
axum = "0.8.4"
base64 = "=0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
envy = "0.4.2"
eventsource-stream = "=0.2.3"
fancy-regex = "=0.17.0"
futures-util = "0.3.31"
gradiated-credentials = { path = "../../packages/credentials" }
h2 = "=0.4.17"
hf-chat-template = "=1.0.0"
hf-hub = { version = "=0.5.0", default-features = false, features = ["rustls-tls", "tokio"] }
hyper = "=1.11.0"
prometheus-client = "=0.25.0"
redis = { version = "=1.5.0", features = ["cluster-async", "token-based-authentication", "tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order", "raw_value"] }
switchyard-translation = "=0.3.0"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }
tokio-postgres = { version = "0.7.15", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
deadpool-postgres = "0.14.2"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
# Request bodies the TypeSafe SDK compresses (`Content-Encoding: zstd`), and gzip.
zstd = "0.14.3"
flate2 = "1.1.11"

[dev-dependencies]
tokio = { version = "1.45.1", features = ["test-util"] }
tower = { version = "0.5.2", features = ["util"] }
