[package]
name = "gradiated-gateway"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97"

[dependencies]
async-trait = "0.1.88"
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
envy = "0.4.2"
hf-chat-template = "=1.0.0"
hf-hub = { version = "=0.5.0", default-features = false, features = ["rustls-tls", "tokio"] }
redis = { version = "=0.29.5", features = ["cluster-async", "tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
