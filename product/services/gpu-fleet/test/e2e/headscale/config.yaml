# The end-to-end test's control server. It serves TLS on 443 because the
# Tailscale client forces port 443 after a recent control dial.
server_url: https://headscale
listen_addr: 0.0.0.0:443
tls_cert_path: /etc/headscale/tls.pem
tls_key_path: /etc/headscale/tls.key
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: true
    region_id: 999
    region_code: e2e
    region_name: e2e
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  auto_update_enabled: false
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
dns:
  magic_dns: true
  base_domain: tailnet.test
  override_local_dns: false
  nameservers:
    global: []
policy:
  mode: file
  path: /etc/headscale/policy.hujson
log:
  level: info
