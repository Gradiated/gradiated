<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gradiated builds open models for everyday software work and trains custom models for teams moving workloads off frontier APIs."
    />
    <!-- page-seo -->
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Gradiated Library"
      href="/feed.xml"
    />
    <!-- The current mark. `data-theme-favicon` is gone with it: the legacy
         ThemeToggle was what swapped this link between a light and a dark
         file, and that component is no longer routed. The icon carries its
         own ground now, so there is nothing to swap.

         The ?v is a cache buster, and it is the point. A browser keeps
         favicons in a store of its own, keyed by URL and far more stubborn
         than the HTTP cache — replacing the bytes at /favicon.ico leaves
         everyone who has already seen the old one still seeing it. A new
         query makes it a new URL, so it is fetched. Bump it if the mark
         changes again. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Open Source AI Lab | Gradiated</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
