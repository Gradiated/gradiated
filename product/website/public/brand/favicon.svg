<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Gradiated</title>
  <!--
    The nav's mark, made self-contained.

    In the app the mark is ONE path: a filled square with the G knocked out of
    it, painted in currentColor so it inherits the page's ink and shows the
    page's ground through the hole. A favicon has no page behind it — the hole
    would show the browser's tab colour, which is unknowable and changes with
    the user's theme.

    So the cream is laid down first and the ink square goes over it: the only
    place the cream survives is the G-shaped hole. Same artwork, same
    proportions, but it carries its own ground.

    Full bleed rather than an inset tile with rounded corners: at 16px a margin
    costs a quarter of the icon's width, and every platform that wants rounded
    corners applies its own mask anyway.
  -->
  <rect width="32" height="32" fill="#f6f3ec" />
  <path
    d="M31.7539 31.7539H0V0H31.7539V31.7539ZM6.70605 11.8359V20.9824H12.2314V25.4375H18.332L25.0469 18.7227V14.9004L20.8887 14.8945L16.1523 19.9023H12.2314V11.8359H25.0469V6.31445H12.2314L6.70605 11.8359Z"
    fill="#181713"
  />
</svg>
