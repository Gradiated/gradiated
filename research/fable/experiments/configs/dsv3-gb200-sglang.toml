# DeepSeek-V3/R1 decode on GB200 NVL72, SGLang large-scale EP.
# PEAK anchor: lmsys 2025-09-25 — 13,386 decode tok/s/GPU (FP8 attn + NVFP4
# MoE, PD-disaggregated decode instance). Unlike the DeepSeek H800 disclosure
# (a daily AVERAGE), this is a saturation benchmark — like-for-like with the
# sim's closed-loop assumption.

[model]
name = "deepseek-v3-nvfp4"
layers = 61
hidden = 7168
heads = 128
kv_heads = 128
head_dim = 128
intermediate = 18432
vocab = 129280
tied_embeddings = false
weight_bytes = 0.6 # NVFP4 MoE + fp8 attention blended
kv_bytes = 1.0     # fp8 latent
mtp_accept = 0.0   # benchmark run, no spec credit assumed

[model.attention.mla]
kv_lora_rank = 512
qk_rope_dim = 64
q_lora_rank = 1536
qk_nope_head_dim = 128
v_head_dim = 128

[model.ffn.moe]
experts = 256
top_k = 8
shared_experts = 1
moe_intermediate = 2048
first_k_dense = 3

[hardware]
name = "b200-nvl72"
tflops = 4500.0      # fp8 dense per GPU
mem_bw_gbs = 8000.0  # HBM3e 192GB
mem_capacity_gb = 192.0
dispatch_us = 3.0
step_sync_us = 100.0
tdp_w = 1200.0
unit_cost_usd = 60000.0
interconnect_gbs = 900.0       # NVLink5 within the NVL72 domain
interconnect_latency_us = 3.0

[kernel]
name = "sglang-cuda-b200"
dispatches_per_layer = 8.0
dispatches_fixed = 20.0
gemm_peak_efficiency = 0.65
gemm_occupancy_half_cells = 5e3
attn_bw_efficiency = 0.65
unfused_activation_traffic = 0.05
grouped_moe = true

[serving]
name = "sglang-ep-decode"
max_batch = 512
prefill_chunk = 8192
sched_overhead_us = 300.0
per_token_host_us = 1.0
prefix_cache_hit = 0.99 # decode-instance proxy
prefill_packing = true
sampling = "device"

[workload]
name = "bench-2k-1k"
num_requests = 4096
input_len = 2000
output_len = 1000

[parallel]
tp = 1
ep = 72
act_bytes = 1.0
comm_overlap = 0.8
ep_imbalance = 1.4 # in-domain EPLB, better than cross-node

[cost]
amortization_months = 36.0
utilization = 0.7
power_usd_per_kwh = 0.09
pue = 1.25
system_overhead_frac = 0.25
