# DeepSeek-V3/R1 decode on H800, DeepSeek production-style EP deployment.
# Anchor: their Feb 2025 disclosure — ~1,850 output tok/s/GPU on decode
# instances (EP144, MLA+MoE fp8, MTP on). Prefill handled by separate
# instances; prefix_cache_hit ~1 makes this loop decode-dominated to match.

[model]
name = "deepseek-v3"
layers = 61
hidden = 7168
heads = 128
kv_heads = 128
head_dim = 128
intermediate = 18432
vocab = 129280
tied_embeddings = false
weight_bytes = 1.0 # native fp8
kv_bytes = 2.0     # bf16 MLA latent
mtp_accept = 0.7

[model.attention.mla]
kv_lora_rank = 512
qk_rope_dim = 64
q_lora_rank = 1536
qk_nope_head_dim = 128
v_head_dim = 128

[model.ffn.moe]
experts = 256
top_k = 8
shared_experts = 1
moe_intermediate = 2048
first_k_dense = 3

[hardware]
name = "h800"
tflops = 1979.0      # fp8 dense
mem_bw_gbs = 3350.0  # HBM3 80GB
mem_capacity_gb = 80.0
dispatch_us = 3.0    # CUDA graphs
step_sync_us = 100.0
tdp_w = 700.0
unit_cost_usd = 30000.0
interconnect_gbs = 50.0      # raw cross-node IB per GPU
interconnect_latency_us = 50.0

[kernel]
name = "sglang-cuda"
dispatches_per_layer = 8.0
dispatches_fixed = 20.0
gemm_peak_efficiency = 0.60
gemm_occupancy_half_cells = 5e3
attn_bw_efficiency = 0.60
unfused_activation_traffic = 0.05
grouped_moe = true

[serving]
name = "sglang-ep"
max_batch = 96
prefill_chunk = 4096
sched_overhead_us = 500.0 # async scheduling overlaps most of it
per_token_host_us = 1.0
prefix_cache_hit = 0.99   # decode-instance proxy: prefill nearly elided
prefill_packing = true
sampling = "device"

[workload]
name = "decode-heavy-4k-ctx"
num_requests = 2048
input_len = 4000
output_len = 500

[parallel]
tp = 1
ep = 144
act_bytes = 1.0 # fp8 comms
comm_overlap = 0.75 # dual-microbatch pipelining (DeepSeek-style)
ep_imbalance = 1.8 # EPLB-managed straggler factor + daily-average duty proxy

[cost]
amortization_months = 36.0
utilization = 0.7
power_usd_per_kwh = 0.09
pue = 1.25
system_overhead_frac = 0.25
