[project]
name = "grad-research"
version = "0.1.0"
description = "Lean autonomous research-factory safety and discovery kernel"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
grad-research = "grad_research.cli:main"
grad-research-lab = "grad_research.lab_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grad_research"]
