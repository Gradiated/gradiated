[project]
name = "gradiated-decide"
version = "0.1.0"
description = "Post-training and evaluation of Gradiated Decide decision models"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gdecide*"]
