<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Measured Gemma 4 endpoint milestones</title>
  <desc id="desc">Horizontal bars show service seconds per request falling from 0.970 for the initial endpoint to 0.625 for the decode-equivalent NGRAM endpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d1b4"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1240" cy="80" r="210" fill="#6b8cff" opacity="0.08"/>
  <circle cx="90" cy="760" r="260" fill="#36d1b4" opacity="0.06"/>

  <text x="76" y="78" fill="#f5f7ff" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="700">Gemma 4 endpoint progression</text>
  <text x="76" y="118" fill="#9ca9c7" font-family="Inter,system-ui,sans-serif" font-size="20">Measured service time · lower is better · one H200 · exact c32 workload</text>

  <g font-family="Inter,system-ui,sans-serif">
    <line x1="490" y1="164" x2="490" y2="690" stroke="#32405f" stroke-width="2"/>
    <line x1="1140" y1="164" x2="1140" y2="690" stroke="#32405f" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="482" y="718" text-anchor="middle" fill="#7f8baa" font-size="16">0.50 s</text>
    <text x="1138" y="718" text-anchor="middle" fill="#7f8baa" font-size="16">1.00 s</text>

    <g fill="#dce3f8" font-size="19">
      <text x="76" y="211">Initial BF16 + E5M2 KV</text>
      <text x="76" y="291">Canonical BF16 stack</text>
      <text x="76" y="371">Dynamic FP8 runtime</text>
      <text x="76" y="451">FP8 + QKV + deferred KV</text>
      <text x="76" y="531">Contiguous local-KV ring</text>
      <text x="76" y="611">E4M3 tied output head</text>
      <text x="76" y="691">Decode-equivalent NGRAM</text>
    </g>

    <g fill="#1a2843">
      <rect x="490" y="184" width="630" height="38" rx="19"/>
      <rect x="490" y="264" width="630" height="38" rx="19"/>
      <rect x="490" y="344" width="630" height="38" rx="19"/>
      <rect x="490" y="424" width="630" height="38" rx="19"/>
      <rect x="490" y="504" width="630" height="38" rx="19"/>
      <rect x="490" y="584" width="630" height="38" rx="19"/>
      <rect x="490" y="664" width="630" height="38" rx="19"/>
    </g>

    <g fill="url(#bar)">
      <rect x="490" y="184" width="611" height="38" rx="19" opacity="0.48"/>
      <rect x="490" y="264" width="545" height="38" rx="19" opacity="0.57"/>
      <rect x="490" y="344" width="257" height="38" rx="19" opacity="0.68"/>
      <rect x="490" y="424" width="246" height="38" rx="19" opacity="0.76"/>
      <rect x="490" y="504" width="202" height="38" rx="19" opacity="0.84"/>
      <rect x="490" y="584" width="197" height="38" rx="19" opacity="0.92"/>
      <rect x="490" y="664" width="164" height="38" rx="19" filter="url(#glow)"/>
    </g>

    <g fill="#f5f7ff" font-size="20" font-weight="700">
      <text x="1120" y="211" text-anchor="end">0.970 s</text>
      <text x="1054" y="291" text-anchor="end">0.919 s</text>
      <text x="766" y="371">0.698 s</text>
      <text x="755" y="451">0.689 s</text>
      <text x="711" y="531">0.656 s</text>
      <text x="706" y="611">0.652 s</text>
      <text x="674" y="691">0.625 s</text>
    </g>
  </g>

  <rect x="76" y="753" width="1248" height="1" fill="#2b3855"/>
  <text x="76" y="786" fill="#8490ad" font-family="Inter,system-ui,sans-serif" font-size="15">Milestones use retained complete-request endpoints. Adjacent bars are not all isolated A/B pairs; see the text for paired controls.</text>
</svg>
