<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Decode-equivalent NGRAM verification</title>
  <desc id="desc">NGRAM finds a repeated suffix in the request history, proposes the continuation, verifies multiple tokens with Gemma in parallel, commits the accepted prefix, and falls back at the first mismatch.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#121b35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#28d6ae"/><stop offset="1" stop-color="#6e83ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7180a4"/></marker>
  </defs>
  <rect width="1400" height="800" rx="28" fill="url(#bg3)"/>
  <text x="70" y="76" fill="#f5f7ff" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="700">Prompt-history speculation, target-model semantics</text>
  <text x="70" y="116" fill="#9da9c6" font-family="Inter,system-ui,sans-serif" font-size="20">No assistant weights · parallel target verification · commit only the accepted prefix</text>

  <g font-family="Inter,system-ui,sans-serif">
    <rect x="70" y="168" width="1260" height="150" rx="24" fill="#111f35" stroke="#2d3e60"/>
    <text x="100" y="207" fill="#b7c2dc" font-size="17" font-weight="700">CURRENT REQUEST TOKEN HISTORY</text>
    <g transform="translate(100 230)" font-size="18" font-weight="700">
      <g fill="#253554"><rect width="110" height="54" rx="12"/><rect x="122" width="110" height="54" rx="12"/><rect x="244" width="110" height="54" rx="12"/><rect x="366" width="110" height="54" rx="12"/><rect x="488" width="110" height="54" rx="12"/><rect x="610" width="110" height="54" rx="12"/><rect x="732" width="110" height="54" rx="12"/><rect x="854" width="110" height="54" rx="12"/><rect x="976" width="110" height="54" rx="12"/></g>
      <g fill="#dce4f8" text-anchor="middle"><text x="55" y="34">call</text><text x="177" y="34">:</text><text x="299" y="34">search</text><text x="421" y="34">{</text><text x="543" y="34">query</text><text x="665" y="34">:</text><text x="787" y="34">…</text><text x="909" y="34">query</text><text x="1031" y="34">:</text></g>
      <rect x="488" y="-4" width="232" height="62" rx="14" fill="none" stroke="#2ed4b0" stroke-width="3"/>
      <rect x="854" y="-4" width="232" height="62" rx="14" fill="none" stroke="#2ed4b0" stroke-width="3"/>
    </g>
  </g>

  <path d="M250 338 V392" stroke="#7180a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 338 V392" stroke="#7180a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1150 338 V392" stroke="#7180a4" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Inter,system-ui,sans-serif">
    <g transform="translate(70 410)">
      <rect width="350" height="230" rx="24" fill="#10272d" stroke="#28c8a5" stroke-width="2"/>
      <circle cx="48" cy="48" r="24" fill="#28c8a5"/><text x="48" y="56" text-anchor="middle" fill="#07121f" font-size="22" font-weight="800">1</text>
      <text x="88" y="55" fill="#61e4c8" font-size="24" font-weight="700">Match suffix</text>
      <text x="30" y="102" fill="#dce4f8" font-size="18">Find the recent history ending</text>
      <text x="30" y="130" fill="#dce4f8" font-size="18">in the same token suffix.</text>
      <text x="30" y="176" fill="#92a5b7" font-size="17">Draft source: this request's</text>
      <text x="30" y="202" fill="#92a5b7" font-size="17">own repeated structure.</text>
    </g>
    <g transform="translate(525 410)">
      <rect width="350" height="230" rx="24" fill="#17203a" stroke="#7086ff" stroke-width="2"/>
      <circle cx="48" cy="48" r="24" fill="#7086ff"/><text x="48" y="56" text-anchor="middle" fill="#0a1225" font-size="22" font-weight="800">2</text>
      <text x="88" y="55" fill="#9aabff" font-size="24" font-weight="700">Verify in parallel</text>
      <text x="30" y="102" fill="#dce4f8" font-size="18">Gemma scores the proposed</text>
      <text x="30" y="130" fill="#dce4f8" font-size="18">continuation in one target pass.</text>
      <g transform="translate(30 160)"><rect width="58" height="36" rx="8" fill="#35466c"/><rect x="68" width="58" height="36" rx="8" fill="#35466c"/><rect x="136" width="58" height="36" rx="8" fill="#35466c"/><rect x="204" width="58" height="36" rx="8" fill="#35466c"/><text x="29" y="24" text-anchor="middle" fill="#fff">✓</text><text x="97" y="24" text-anchor="middle" fill="#fff">✓</text><text x="165" y="24" text-anchor="middle" fill="#fff">✓</text><text x="233" y="24" text-anchor="middle" fill="#ff9d9d">×</text></g>
    </g>
    <g transform="translate(980 410)">
      <rect width="350" height="230" rx="24" fill="#231a39" stroke="#ad73ff" stroke-width="2"/>
      <circle cx="48" cy="48" r="24" fill="#ad73ff"/><text x="48" y="56" text-anchor="middle" fill="#1a0f2e" font-size="22" font-weight="800">3</text>
      <text x="88" y="55" fill="#c79cff" font-size="24" font-weight="700">Commit safely</text>
      <text x="30" y="102" fill="#e5def5" font-size="18">Commit the accepted prefix.</text>
      <text x="30" y="130" fill="#e5def5" font-size="18">Use target correction at mismatch.</text>
      <text x="30" y="176" fill="#aa9dbc" font-size="17">Cache positions, attention</text>
      <text x="30" y="202" fill="#aa9dbc" font-size="17">dispatch, and logits stay bound.</text>
    </g>
  </g>

  <line x1="420" y1="525" x2="510" y2="525" stroke="#7180a4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="875" y1="525" x2="965" y2="525" stroke="#7180a4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="678" width="1260" height="82" rx="18" fill="url(#accent)" opacity="0.16"/>
  <g text-anchor="middle" fill="#dffbf5" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700">
    <text x="700" y="712">Promotion requires cumulative token reconstruction, target-shadow agreement,</text>
    <text x="700" y="739">tool semantics, exact accounting, and quality gates.</text>
  </g>
</svg>
