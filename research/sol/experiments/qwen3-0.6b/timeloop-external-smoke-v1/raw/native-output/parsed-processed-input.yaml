dumped_by_timeloop_front_end: true
architecture:
    version: '0.4'
    subtree:
      - name: system_top_level
        attributes:
            version: '0.4'
            has_power_gating: false
            power_gated_at: null
        local:
          - name: DRAM[1..1]
            class: DRAM
            attributes:
                type: '"LPDDR4"'
                width: 64
                datawidth: 16
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                power_gated_at: null
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: shared_glb[1..1]
            class: smartbuffer_SRAM
            attributes:
                depth: 16384
                width: 64
                n_banks: 32
                datawidth: 16
                read_bandwidth: 16
                write_bandwidth: 16
                has_power_gating: false
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: inter_PE_spatial[1..1]
            class: dummy_storage
            attributes:
                width: 1
                depth: 1
                datawidth: 1
                technology: -1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                power_gated_at: null
            enabled: true
          - name: pe_spad[1..256]
            class: smartbuffer_SRAM
            attributes:
                depth: 192
                width: 16
                datawidth: 16
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 16
                meshY: 16
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: weight_reg[1..256]
            class: storage
            subclass: aladdin_register
            attributes:
                depth: 1
                width: 16
                datawidth: 16
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 16
                meshY: 16
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: input_activation_reg[1..256]
            class: storage
            subclass: aladdin_register
            attributes:
                depth: 1
                width: 16
                datawidth: 16
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 16
                meshY: 16
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: output_activation_reg[1..256]
            class: storage
            subclass: aladdin_register
            attributes:
                depth: 1
                width: 16
                datawidth: 16
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 16
                meshY: 16
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - write
              - leak
              - read
              - update
            enabled: true
          - name: mac[1..256]
            class: intmac
            attributes:
                multiplier_width: 16
                adder_width: 32
                has_power_gating: false
                meshX: 16
                meshY: 16
                power_gated_at: null
                technology: '"45nm"'
            required_actions:
              - compute
            enabled: true
architecture_constraints:
    targets:
      - type: temporal
        permutation: MB
        target: DRAM
      - type: temporal
        permutation: MB
        target: shared_glb
      - type: spatial
        permutation: MB
        target: inter_PE_spatial
      - factors: B=1,M=1,N=1,K=1
        permutation: BMNK
        type: temporal
        target: inter_PE_spatial
      - bypass:
          - Inputs
          - Weights
          - Outputs
        type: bypass
        target: inter_PE_spatial
      - bypass:
          - Inputs
          - Weights
        keep:
          - Outputs
        type: bypass
        target: pe_spad
      - type: temporal
        permutation: MB
        target: pe_spad
      - keep:
          - Weights
        type: bypass
        bypass:
          - Inputs
          - Outputs
        target: weight_reg
      - type: temporal
        permutation: MB
        target: weight_reg
      - keep:
          - Inputs
        type: bypass
        bypass:
          - Outputs
          - Weights
        target: input_activation_reg
      - type: temporal
        permutation: MB
        target: input_activation_reg
      - keep:
          - Outputs
        type: bypass
        bypass:
          - Inputs
          - Weights
        target: output_activation_reg
      - type: temporal
        permutation: MB
        target: output_activation_reg
problem:
    version: '0.4'
    shape:
        name: FoundryGemmBMNK
        dimensions:
          - B
          - M
          - N
          - K
        data_spaces:
          - name: Inputs
            projection:
              -   -   - B
              -   -   - M
              -   -   - K
            read_write: false
          - name: Weights
            projection:
              -   -   - N
              -   -   - K
            read_write: false
          - name: Outputs
            projection:
              -   -   - B
              -   -   - M
              -   -   - N
            read_write: true
        coefficients: []
    instance:
        B: 1
        M: 1
        N: 1024
        K: 2048
        densities: {}
compound_components:
    version: '0.4'
    classes: []
mapping: []
mapper:
    optimization_metrics:
      - delay
    version: '0.4'
    live_status: false
    num_threads: 1
    timeout: 100
    victory_condition: 1
    search_size: 1
    algorithm: random_pruned
    diagnostics: true
    out_prefix: timeloop-mapper
    optimization_metric: []
    sync_interval: null
    log_interval: 1
    log_oave_mappings: false
    log_all_mappings: false
    log_mappings_yaml: false
    log_mappings_verbose: false
    log_stats: false
    log_suboptimal: false
    penalize_consecutive_bypass_fails: false
    emit_whoop_nest: false
    max_temporal_loops_in_a_mapping: -1
    filter_revisits: false
    max_permutations_per_if_visit: 16
mapspace:
    version: '0.4'
    template: uber
globals:
    version: '0.4'
    environment_variables: {}
    expression_custom_functions: []
    accelergy_plug_ins: []
