[project]
name = "repo-browser-runtime"
version = "0.1.0"
description = "Repo-local browser runtime for agent research and product verification"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.13.11,<0.14",
  "playwright>=1.50,<2",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
]

[tool.uv]
package = false
# Upstream exact pins otherwise retain published security vulnerabilities.
override-dependencies = [
  "aiohttp>=3.14.5,<3.15",
  "certifi==2026.10.19",
  "pillow>=13.0.0,<14",
  "anyio>=4.14.2,<5",
  "mcp>=2.3.0,<3",
  "pypdf>=6.21.2,<7",
]
