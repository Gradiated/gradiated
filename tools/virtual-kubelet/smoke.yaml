apiVersion: v1
kind: Namespace
metadata:
  name: vk-trial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
  namespace: vk-trial
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vk-smoke
  template:
    metadata:
      labels:
        app: vk-smoke
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: runpod-prototype
      tolerations:
        - key: gradiated.com/vk-trial
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: smoke
          image: gradiated/vk-smoke:process-v1
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
